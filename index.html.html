<script>
/* ============================================================
   SPOTIFY PLAYBACK
   Wraps Spotify's official embed *Playback SDK* — the "iFrame API"
   (https://developer.spotify.com/documentation/embeds/references/iframe-api).
   This is the real, documented, Spotify-sanctioned way to drive an embedded
   player from your own page: your own button calls play()/pause(), and the
   embed reports real playback state back via postMessage events. This is
   NOT the same as raw <audio> access to Spotify's catalogue (which no
   licensed integration is allowed to do) — it is Spotify's actual supported
   mechanism for exactly this use case.

   One controller is created once, hidden, and reused for every track via
   loadUri() — this is what makes "only one track ever plays at a time"
   trivially true (there is physically only one player), rather than
   something the app has to police separately.

   LATENCY FIX (see conversation notes): previously, the Spotify iframe-api
   script was only requested inside play() — i.e. AFTER the user's first tap
   — so the entire script-fetch + controller-handshake chain happened on the
   user's perceived timeline. Now:
     1. warmUp() kicks off script load + controller creation the moment
        Music Mode is entered (idle time, while the user is still reading),
        optionally seeded with the first track's URI so Spotify can start
        preparing it as part of the same initial handshake.
     2. preload(trackId) loads a track into the controller WITHOUT playing
        it, called whenever a new card becomes "current" (session start,
        Next, Previous) — so by the time the user actually presses Play,
        the track is very likely already loaded and only a resume/play call
        (not a full loadUri round-trip) is needed.
     3. play(trackId) checks whether that track is already the one loaded
        into the controller; if so it takes the fast path (resume/play
        only), otherwise it falls back to the original cold
        loadUri()+play() path — so nothing breaks if a track is played
        without ever having been preloaded.
   preload() never counts as "starting playback": it's followed by a
   defensive pause() in case any embed configuration were to autoplay on
   loadUri, so no audio is ever heard before a real user gesture.

   FALLBACK: if the Spotify iframe-api script fails to load (blocked,
   offline, ad-blocker, etc.) within a few seconds, the app does NOT pretend
   playback still works. It switches to `fallbackMode`, and the UI (in
   app.js) swaps the custom big-button player for Spotify's own plain
   embedded widget for that track — a real, working, Spotify-compatible
   player, just without our custom play/pause state wired to it.
   ============================================================ */
const SpotifyPlayer = (function () {
  let IFrameAPI = null;
  let controller = null;
  let controllerReady = false;
  let apiLoadStarted = false;
  let apiLoadTimeout = null;

  // Incremented every time initialization is (re)started — lets any
  // in-flight async callback from a PREVIOUS attempt recognize it's been
  // superseded (see recoverStuckInitialization()) and no-op instead of
  // creating a second controller. This is what makes it safe to retry
  // initialization after a suspected browser-suspension stall without any
  // risk of ending up with duplicate players.
  let initEpoch = 0;

  let currentTrackId = null;      // track currently loaded into the controller (preloaded, playing, or paused)
  let status = "idle";            // idle | connecting | ready | playing | paused | error
  let fallbackMode = false;
  let hasBeenPlayRequested = false; // true once play() has actually been called for currentTrackId
  let lastErrorTrackId = null;      // which track the current "error" status refers to, for retry

  let pendingPlayTrackId = null;    // play() requested before the controller existed
  let pendingPreloadTrackId = null; // preload() requested before the controller existed

  // Two different waits need two different budgets:
  //  - CONNECT_TIMEOUT_MS: the FULL wait for the controller to finish
  //    initializing in the first place. This is genuine setup time (script
  //    fetch + Spotify's iframe handshake) and can legitimately take a few
  //    seconds, more so on slower/mobile networks — so it gets a generous
  //    budget.
  //  - DEFERRED_RETRY_TIMEOUT_MS: once the controller finally becomes
  //    ready and a play() that was waiting on it actually fires, that call
  //    happens from inside an async SDK callback, NOT synchronously inside
  //    the user's original click — so on browsers with strict autoplay/
  //    gesture rules (this is materially stricter on mobile Safari/Chrome
  //    than desktop) it can be silently rejected. That failure mode
  //    resolves near-instantly one way or the other, so it gets a short
  //    budget instead of reusing the long one — the user sees a retry
  //    option quickly rather than waiting out the full window a second time.
  let connectTimeout = null;
  const CONNECT_TIMEOUT_MS = 8000;
  const DEFERRED_RETRY_TIMEOUT_MS = 2500;

  function clearConnectTimeout() {
    if (connectTimeout) { clearTimeout(connectTimeout); connectTimeout = null; }
  }

  const changeListeners = [];
  function emitChange() { changeListeners.forEach(fn => { try { fn(); } catch (e) {} }); }
  function onChange(fn) { changeListeners.push(fn); }

  // Public: what should the UI show for THIS track right now. "ready"
  // (preloaded but not yet played) is deliberately reported as "idle" to
  // the UI — preloading is an internal latency optimization, not a new
  // user-facing state; the card should still read "Tap to listen".
  function getStateFor(trackId) {
    if (fallbackMode) return { status: "fallback" };
    if (currentTrackId !== trackId) return { status: "idle" };
    if (status === "error") return { status: "error" };
    return { status: status === "ready" ? "idle" : status };
  }
  function isFallback() { return fallbackMode; }
  function isControllerReady() { return controllerReady; }

  // Kick off script load + controller creation as early as possible — call
  // this the moment Music Mode is entered, not when Play is first pressed.
  // This is the single biggest latency fix: it moves the script-fetch and
  // iframe handshake into idle time before the user has even looked at the
  // card, instead of onto the critical path after their first tap.
  // Idempotent and cheap to call every time Music Mode is entered (including
  // returning after leaving) — after the first call it's just a no-op guard
  // check, so callers never need to know whether this is the first visit.
  function warmUp() {
    if (fallbackMode) return;
    loadApi();
  }

  function loadApi() {
    if (apiLoadStarted) return;
    apiLoadStarted = true;
    const myEpoch = ++initEpoch;

    apiLoadTimeout = setTimeout(() => {
      if (myEpoch !== initEpoch) return; // superseded by a recovery reset — this attempt no longer matters
      if (!controllerReady) {
        fallbackMode = true;
        emitChange();
      }
    }, 6000);

    window.onSpotifyIframeApiReady = (API) => {
      if (myEpoch !== initEpoch) return; // a recovery reset happened since this script was requested — ignore
      IFrameAPI = API;
      const host = document.getElementById("spotify-controller-host");
      host.innerHTML = ""; // clear out any iframe left behind by a superseded attempt before creating a new one
      IFrameAPI.createController(host, { uri: "", width: "1", height: "1" }, (ctrl) => {
        if (myEpoch !== initEpoch) return; // guard the second async hop too — same reasoning as above
        controller = ctrl;
        controllerReady = true;
        clearTimeout(apiLoadTimeout);
        controller.addListener("playback_update", (e) => {
          // Source of truth for play/pause UI is always the real embed
          // event — EXCEPT before the user has actually asked to play this
          // track. preload()'s defensive pause() (there to guard against
          // any embed config that might autoplay on loadUri) can itself
          // trigger this same event; without this guard, that harmless
          // defensive pause would overwrite the "ready" (preloaded, never
          // played) state into a misleading "paused" — showing "tap to
          // resume" for a track that was never played in the first place.
          if (!hasBeenPlayRequested) return;
          clearConnectTimeout(); // a real response arrived — the request did not stall
          status = e && e.data && e.data.isPaused === false ? "playing" : "paused";
          emitChange();
        });
        emitChange();

        // Honor anything that was requested while we were still connecting
        // (e.g. preloadCurrentCard() ran the instant the screen rendered,
        // well before the controller was actually ready yet). This play()
        // call is happening from inside an async SDK callback, not
        // synchronously inside the user's original click — flagged as
        // `deferred` so it gets the short failure-detection window instead
        // of waiting out the long one a second time (see play()).
        if (pendingPlayTrackId) {
          const wantPlay = pendingPlayTrackId;
          pendingPlayTrackId = null;
          play(wantPlay, { deferred: true });
        } else if (pendingPreloadTrackId) {
          const wantPreload = pendingPreloadTrackId;
          pendingPreloadTrackId = null;
          preload(wantPreload);
        }
      });
    };

    const script = document.createElement("script");
    script.src = "https://open.spotify.com/embed/iframe-api/v1";
    script.async = true;
    script.onerror = () => { if (myEpoch === initEpoch) { fallbackMode = true; emitChange(); } };
    document.body.appendChild(script);
  }

  // Browsers (mobile especially — iOS Safari in particular) can throttle or
  // fully suspend a backgrounded tab's timers and in-flight network/SDK
  // work. If the user backgrounds the app mid-initialization (switches
  // apps, locks the screen) and returns to find the player still stuck —
  // neither ready nor already in fallback — a page refresh has always
  // "fixed" this, but only because it resets the player's own internal
  // state. This does exactly that reset, and nothing else: session state,
  // quiz progress, and the shuffled deck all live in completely separate
  // variables this never touches. Guarded by initEpoch so any callback
  // from the original (stalled) attempt that eventually does resolve is
  // recognized as stale and ignored — never creating a second controller.
  function recoverStuckInitialization() {
    if (fallbackMode || controllerReady) return; // nothing stuck to recover
    clearTimeout(apiLoadTimeout);
    initEpoch++; // invalidate any callback still in flight from the stalled attempt
    apiLoadStarted = false;
    controllerReady = false;
    IFrameAPI = null;
    controller = null;
    loadApi();
  }

  let hiddenSince = null;
  function handleVisibilityChange() {
    if (document.visibilityState === "hidden") {
      hiddenSince = Date.now();
      return;
    }
    if (hiddenSince === null) return;
    const wasHiddenMs = Date.now() - hiddenSince;
    hiddenSince = null;
    // Only worth attempting recovery if the tab was actually backgrounded
    // long enough for suspension to plausibly be the cause — a quick
    // app-switch-and-back shouldn't trigger a reset for no reason.
    if (wasHiddenMs >= 2000) recoverStuckInitialization();
  }
  if (typeof document !== "undefined") {
    document.addEventListener("visibilitychange", handleVisibilityChange);
  }

  // Load a track into the controller WITHOUT starting playback, so that a
  // later real play() call for the same track can skip loadUri() entirely.
  // Safe to call proactively (card render, Next/Previous) since it never
  // starts audio: a defensive pause immediately follows the load.
  function preload(trackId) {
    if (fallbackMode || !trackId) return;
    if (currentTrackId === trackId) return; // already loaded/loading/playing this one — nothing to do
    loadApi();
    if (!controllerReady) { pendingPreloadTrackId = trackId; return; }
    currentTrackId = trackId;
    status = "ready";
    hasBeenPlayRequested = false;
    controller.loadUri("spotify:track:" + trackId);
    controller.pause();
    emitChange();
  }

  function play(trackId, opts) {
    if (fallbackMode) return;
    loadApi();
    clearConnectTimeout(); // any earlier in-flight attempt is superseded by this one

    const isDeferred = !!(opts && opts.deferred);

    if (!controllerReady) {
      currentTrackId = trackId;
      status = "connecting";
      hasBeenPlayRequested = true;
      pendingPlayTrackId = trackId;
      emitChange();
      // Genuine wait for the controller to finish initializing — gets the
      // full budget (see CONNECT_TIMEOUT_MS comment above).
      connectTimeout = setTimeout(() => handleConnectTimeout(trackId), CONNECT_TIMEOUT_MS);
      return;
    }

    status = "connecting";
    hasBeenPlayRequested = true;
    emitChange();
    // A deferred call is one firing from inside an async SDK-ready callback
    // rather than synchronously inside the user's click — the case most at
    // risk of a silent autoplay/gesture rejection (materially more likely
    // on mobile Safari/Chrome than desktop). Give it the short budget so a
    // rejection surfaces quickly with a retry option, instead of the user
    // waiting out the same long window twice.
    connectTimeout = setTimeout(() => handleConnectTimeout(trackId), isDeferred ? DEFERRED_RETRY_TIMEOUT_MS : CONNECT_TIMEOUT_MS);

    if (currentTrackId !== trackId) {
      // Cold path: this track was never preloaded — load and play it now.
      currentTrackId = trackId;
      controller.loadUri("spotify:track:" + trackId);
      controller.play();
    } else {
      // Fast path: already loaded into the controller (via preload(), the
      // warm-up seed, or simply already being the current track) — no
      // loadUri round trip needed, just start it.
      (controller.resume || controller.play).call(controller);
    }
  }

  // If Spotify's response never arrives within CONNECT_TIMEOUT_MS, stop
  // waiting and surface a real error with a retry path — never leave the
  // button disabled indefinitely (the only escape from that used to be a
  // full page refresh, which loses session state; this replaces it).
  function handleConnectTimeout(trackId) {
    // Guard against a STALE timeout from an earlier, already-superseded
    // attempt firing after a newer request already succeeded or moved on —
    // only apply if this is still the in-flight request it was armed for.
    if (currentTrackId !== trackId || status !== "connecting") return;
    status = "error";
    lastErrorTrackId = trackId;
    emitChange();
  }

  // Explicit retry entry point for the UI's error-state button. Clears the
  // stuck error state and issues a fresh play() attempt — reusing the
  // exact same, already-warmed-up controller and preloaded track state
  // rather than reinitializing anything.
  function retry(trackId) {
    status = "idle";
    play(trackId);
  }

  function pause() {
    clearConnectTimeout(); // moving away from this track supersedes any in-flight connect attempt for it
    if (controller && controllerReady) controller.pause();
    if (currentTrackId && hasBeenPlayRequested && status !== "error") status = "paused";
    emitChange();
  }

  return { play, pause, retry, preload, warmUp, onChange, getStateFor, isFallback, isControllerReady };
})();
</script>

<script>
/* ============================================================
   APP CONTROLLER
   ============================================================ */
/**
 * APP CONTROLLER
 * Hash-based router + screen renderers. All content comes from
 * READING_DATA / MUSIC_DATA (+ Store overrides) — no dance or song name is
 * ever hardcoded here.
 */

// ---------- data accessors (layer localStorage overrides onto MUSIC_DATA) ----------

function getReadingData() { return READING_DATA; }

// The master dataset must be immutable from every user-facing activity's
// point of view: Listen & Identify, Browse Tunes, and the Metadata Quiz
// all read through here, and none of them may be able to permanently
// suppress a song for each other or for a future session. Returns a fresh
// copy of MUSIC_DATA every time — no override layer, no persisted
// corrections, nothing that could cause the available song count to drift
// depending on what a user previously did in the app.
function getMusicData() {
  return MUSIC_DATA.slice();
}

// ---------- small shared UI pieces ----------

function topbar() {
  return h("div", { class: "topbar" }, [
    h("a", { class: "topbar__brand", href: "#/", onClick: (e) => { e.preventDefault(); location.hash = "#/"; } }, [
      "Céilí Prep",
      h("small", {}, ["An Coimisiún · Test Practice"]),
    ]),
  ]);
}

function footer() {
  return h("div", { class: "app-footer" }, [
    "Source: Ár Rincí Céilí (An Coimisiún le Rincí Gaelacha, 2014) · Music Exam Set Dance reference & Spotify playlist. Built for practice — always verify against official CLRG materials."
  ]);
}

function crumb(text) {
  const hash = location.hash || "";
  const kind = hash.startsWith("#/reading") ? " crumb--reading" : "";
  return h("div", { class: "crumb" + kind }, [text]);
}

function page(children) {
  const hash = location.hash || "#/";
  // Deeper "activity" routes (anything under a mode, but not the mode's
  // own landing page — that gets the full mode-banner instead) get a
  // quiet mode-colored accent instead, so they still say "you're in
  // Music/Reading Mode" without repeating the big banner on every screen.
  const mode = hash.indexOf("#/music/") === 0 ? "music" : hash.indexOf("#/reading/") === 0 ? "reading" : "";
  const cls = "page" + (mode ? " activity-accent activity-accent--" + mode : "");
  return h("div", { class: cls }, [backButton(), ...children]);
}

// ---------- ROUTER ----------

// The app understands three levels, and the Back button always resolves to
// the correct PARENT LEVEL — not "whatever screen was visited before this
// one" (that's a history stack, which is exactly what produces wrong
// results here: e.g. Listen & Identify -> Browse Tunes -> Metadata Quiz ->
// Back would retrace through Browse Tunes instead of jumping straight to
// Music Mode's home, and multiple hops through different activities in the
// same mode would need multiple Back presses to escape the mode at all).
// Classifying the CURRENT route is enough to know the correct parent —
// no history tracking, no stack, no risk of it drifting out of sync with
// reality.
//
//   home      "#/"                        -> no parent (Back button hidden)
//   mode      "#/music", "#/reading"      -> parent is Home ("#/")
//   activity  anything else under         -> parent is that mode's home
//             "#/music/..." or "#/reading/..."
function classifyRoute(hash) {
  hash = hash || "#/";
  if (hash === "#/") return { level: "home" };
  if (hash === "#/music") return { level: "mode", mode: "music" };
  if (hash === "#/reading") return { level: "mode", mode: "reading" };
  if (hash.indexOf("#/music/") === 0) return { level: "activity", mode: "music" };
  if (hash.indexOf("#/reading/") === 0) return { level: "activity", mode: "reading" };
  return { level: "home" }; // unrecognized route — safest fallback is "nowhere to go back to"
}

function getBackTarget(hash) {
  const info = classifyRoute(hash);
  if (info.level === "home") return null;
  if (info.level === "mode") return "#/";
  return "#/" + info.mode; // activity -> that mode's own home page
}

function goBack() {
  const target = getBackTarget(location.hash || "#/");
  if (target === null) return; // shouldn't be reachable — the button is hidden on Home
  // A plain hash assignment — identical, from the app's perspective, to the
  // user clicking a nav link to that same destination. No page refresh, no
  // extra reset logic beyond whatever that screen's own render function
  // already does on a normal visit, so nothing here can destroy session
  // state beyond what already happens when reaching that screen any other
  // way (see individual render functions — unchanged).
  location.hash = target;
}

function backButton() {
  if (getBackTarget(location.hash || "#/") === null) return null; // never shown on Home
  return h("button", { class: "back-button", onClick: goBack, "aria-label": "Back" }, [
    h("span", { "aria-hidden": "true" }, ["←"]),
    "Back",
  ]);
}

function router() {
  const hash = location.hash || "#/";
  const parts = hash.replace(/^#\//, "").split("/").filter(Boolean);

  // One central place to mark which environment we're in, so CSS (the
  // subtle per-mode background tint) can respond without every individual
  // screen needing to set it itself.
  document.body.dataset.mode = parts[0] === "music" ? "music" : parts[0] === "reading" ? "reading" : "";

  if (parts.length === 0) return renderHome();

  if (parts[0] === "reading") {
    if (parts.length === 1) return renderReadingModeSelect();
    if (parts[1] === "browse") return renderReadingBrowse();
    if (parts[1] === "dance" && parts[2]) return renderDanceDetail(parts[2]);
    if (parts[1] === "study" && (parts[2] === "easy" || parts[2] === "hard")) return renderReadingStudy(parts[2]);
    // legacy routes from the old quiz/ordering/flashcards system redirect to the mode picker
    if (parts[1] === "quiz" || parts[1] === "flashcards" || parts[1] === "ordering") return renderReadingModeSelect();
  }

  if (parts[0] === "music") {
    if (parts.length === 1) return renderMusicHub();
    if (parts[1] === "browse") return renderMusicBrowse();
    if (parts[1] === "quiz") return renderMusicQuiz();
    // Legacy aliases from removed/superseded screens redirect to Music
    // Mode's main screen rather than 404ing on an old bookmark/link.
    if (parts[1] === "flashcards" || parts[1] === "review") return renderMusicHub();
  }

  return renderHome();
}

window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", router);

// ================================================================
// HOME
// ================================================================

// Small, sophisticated line-art icons (not emoji/decorative clip-art) used
// wherever Music/Reading need a quick, non-text identity marker: the Home
// cards, and each mode's own banner header.
function modeIconSvg(kind) {
  if (kind === "music") {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>`;
  }
  // reading
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5c-1.5-1.2-3.5-2-6-2v13c2.5 0 4.5.8 6 2 1.5-1.2 3.5-2 6-2V4.5c-2.5 0-4.5.8-6 2z"/><path d="M12 6.5v13"/></svg>`;
}

function modeIconEl(kind, className) {
  const el = h("div", { class: className }, []);
  el.innerHTML = modeIconSvg(kind);
  return el;
}

// Strong "you are here" banner used once per mode — on that mode's own
// landing screen only (Listen & Identify / Study picker). Deeper activity
// screens use the lighter .activity-accent treatment instead, so Home,
// Mode, and Activity read as three visually distinct levels rather than
// the same header repeated everywhere.
function modeBanner(mode, eyebrow, title, subtitle) {
  return h("div", { class: "mode-banner mode-banner--" + mode }, [
    modeIconEl(mode, "mode-banner__icon"),
    h("div", { class: "mode-banner__eyebrow" }, [eyebrow]),
    h("h1", { class: "mode-banner__title" }, [title]),
    h("p", { class: "mode-banner__subtitle" }, [subtitle]),
  ]);
}

function renderHome() {
  const wrap = h("div", {}, [
    topbar(),
    h("div", { class: "hero" }, [
      crumb("Ár Rincí Céilí · Study Tool"),
      h("h1", {}, ["Irish Dancing Test"]),
      h("p", {}, ["Practice the movements, bar counts, and music of the thirty CLRG céilí dances — and the set-dance tunes for your music exam — until they're second nature."]),
    ]),
    h("div", { class: "mode-grid" }, [
      h("button", { class: "mode-card mode-card--music", onClick: () => location.hash = "#/music" }, [
        modeIconEl("music", "mode-card__icon"),
        h("div", { class: "mode-card__title" }, ["Music Mode"]),
        h("p", { class: "mode-card__tagline" }, ["Listen and identify the music."]),
        h("p", { class: "mode-card__desc" }, ["Hear a set-dance tune, guess it, then flip to check — matched against the exam reference table."]),
        h("span", { class: "mode-card__cta" }, ["Practice music →"]),
      ]),
      h("button", { class: "mode-card mode-card--reading", onClick: () => location.hash = "#/reading" }, [
        modeIconEl("reading", "mode-card__icon"),
        h("div", { class: "mode-card__title" }, ["Reading Mode"]),
        h("p", { class: "mode-card__tagline" }, ["Practice dances, movements, bars, and order."]),
        h("p", { class: "mode-card__desc" }, ["Recall each dance's name, its movements, and the exact order the book teaches them in."]),
        h("span", { class: "mode-card__cta" }, ["Practice reading →"]),
      ]),
    ]),
    footer(),
  ]);
  mount(wrap);
}

// ================================================================
// READING MODE
// ================================================================

function readingModeMenu(active) {
  const items = [
    ["study", "Study (Easy/Hard)", "#/reading"],
    ["browse", "Browse all 30 dances", "#/reading/browse"],
  ];
  return h("div", { class: "tab-strip tab-strip--reading" }, items.map(([key, label, url]) =>
    h("button", { "aria-current": String(active === key), onClick: () => location.hash = url }, [label])
  ));
}

function renderReadingBrowse() {
  const data = getReadingData();
  mount(h("div", {}, [
    topbar(),
    page([
      crumb("Reading Mode / Browse"),
      h("h1", { class: "page-title" }, ["All 30 dances"]),
      p_lede("Tap a dance to see its full movement list as extracted from the source book."),
      readingModeMenu("browse"),
      h("div", { class: "section-grid" }, data.map(d =>
        h("button", { class: "tile", onClick: () => location.hash = `#/reading/dance/${d.id}` }, [
          h("div", { class: "tile__num" }, [`No. ${d.number}`]),
          h("div", { class: "tile__irish" }, [d.irishName]),
          h("div", { class: "tile__english" }, [d.englishName]),
        ])
      )),
    ]),
    footer(),
  ]));
}

function p_lede(text) { return h("p", { class: "page-lede" }, [text]); }

function barsCell(bars) {
  const wrap = h("span", {}, [String(bars) + " "]);
  wrap.appendChild(beatDots(Math.min(bars, 24), Math.min(bars, 24)));
  return wrap;
}

function renderDanceDetail(id) {
  const dance = getReadingData().find(d => d.id === id);
  if (!dance) return renderReadingBrowse();

  const sections = dance.sections.map(section =>
    h("div", { class: "section-block" }, [
      h("div", { class: "section-block__title" }, [section.title]),
      h("div", { class: "table-scroll" }, [
        h("table", { class: "movements" }, [
          h("thead", {}, [h("tr", {}, [
            h("th", {}, ["#"]), h("th", {}, ["Irish"]), h("th", {}, ["English"]), h("th", {}, ["Bars"]),
          ])]),
          h("tbody", {}, section.movements.map(m =>
            h("tr", {}, [
              h("td", { class: "mov-order" }, [String(m.order)]),
              h("td", { class: "mov-irish" }, [m.irish]),
              h("td", {}, [m.english + (m.tune ? ` (${m.tune})` : "")]),
              h("td", { class: "mov-bars" }, [
                typeof m.bars === "number" ? barsCell(m.bars) : h("span", { class: "bars-unstated" }, ["not stated in source"]),
              ]),
            ])
          )),
        ]),
      ]),
    ])
  );

  mount(h("div", {}, [
    topbar(),
    page([
      crumb(`Reading Mode / Browse / No. ${dance.number}`),
      h("div", { class: "dance-header" }, [
        h("h1", { class: "dance-header__irish" }, [dance.irishName]),
        h("div", { class: "dance-header__english" }, [dance.englishName]),
        h("div", { class: "meta-tags" }, [
          h("span", { class: "meta-tag" }, [dance.meter]),
          h("span", { class: "meta-tag" }, [dance.formation]),
          h("span", { class: "meta-tag" }, [`pp. ${dance.page}`]),
        ]),
      ]),
      ...sections,
      dance.structureNotes ? h("div", { class: "notes-box" }, [dance.structureNotes]) : null,
      h("div", { class: "btn-row" }, [
        h("button", { class: "btn btn--ghost", onClick: () => location.hash = "#/reading/browse" }, ["← Back to all dances"]),
      ]),
    ]),
    footer(),
  ]));
}

// ---------- Reading quiz (stateful session) ----------

// ---------------- Reading Mode: Study (Easy / Hard) ----------------
//
// This is the primary Reading Mode experience: pick a difficulty, then
// answer randomized questions built directly from READING_DATA (no
// hardcoded dance content). See the block comment above READING_DATA for
// the data model this all reads from.

let studySession = null;

// A small local Levenshtein distance, used only for tolerant dance-name
// matching (typos/case/punctuation) — deliberately a *stricter* threshold
// than Matching.compare's fuzzy-song-title band, since this is grading a
// recall quiz, not proposing a probable song match.
function levenshteinLocal(a, b) {
  const m = a.length, n = b.length;
  const d = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) d[i][0] = i;
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
    }
  }
  return d[m][n];
}

function normalizeForRecall(str) {
  return String(str || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // strip accents
    .replace(/[^a-z0-9\s]/g, "")   // strip punctuation (apostrophes, periods, etc.)
    .replace(/\s+/g, " ")
    .trim();
}

// Tolerant of case/punctuation/whitespace differences; NOT tolerant of a
// genuinely different answer — small edit-distance budget scaled to length.
function checkDanceNameAnswer(userInput, dance) {
  const a = normalizeForRecall(userInput);
  const b = normalizeForRecall(dance.englishName);
  if (!a) return false;
  if (a === b) return true;
  const threshold = Math.max(1, Math.floor(b.length * 0.12));
  return levenshteinLocal(a, b) <= threshold;
}

function sameMovementOrder(a, b) {
  return a.length === b.length && a.every((m, i) => b[i] && m.irish === b[i].irish && m.section === b[i].section);
}

// Shuffle a movement list, guaranteeing the result isn't accidentally the
// already-correct order (required by spec — otherwise a "correct by luck"
// shuffle would let a user pass without doing anything).
function shuffleMovementsForQuestion(list) {
  if (list.length < 2) return list.slice();
  let attempt = Quiz.shuffle(list);
  let tries = 0;
  while (sameMovementOrder(attempt, list) && tries < 12) { attempt = Quiz.shuffle(list); tries++; }
  if (sameMovementOrder(attempt, list)) {
    // Deterministic fallback (matters most for 2-item lists, where a
    // shuffle has only two possible outcomes): force a swap.
    attempt = list.slice();
    [attempt[0], attempt[1]] = [attempt[1], attempt[0]];
  }
  return attempt;
}

// "Number of Bars" is only well-defined as a single number when the whole
// dance is one flat, fully-numeric movement list (progressive/round/long
// dances) — for the Lead-Around/Body/Figures structured dances the Body is
// danced multiple times per the book's own instructions, so a single
// "total" isn't something the source actually states. In that case (or
// whenever some movement's bars aren't stated), ask about ONE specific,
// clearly-named movement instead — never invent a total that isn't in the
// source, and always make explicit which figure is being asked about.
function buildBarsQuestion(dance, section) {
  const allNumericInSection = section.movements.every(m => typeof m.bars === "number");
  if (dance.sections.length === 1 && allNumericInSection) {
    const total = section.movements.reduce((sum, m) => sum + m.bars, 0);
    return {
      type: "total",
      // NOTE: deliberately does NOT name the dance — this prompt is only
      // ever shown in Hard Mode, directly below the "what dance is this?"
      // input, so naming it here would hand over the answer to that
      // separate, supposedly-independent recall question.
      prompt: `How many bars does this dance add up to in total — all movements, once through?`,
      correctAnswer: total,
    };
  }
  const inSection = section.movements.filter(m => typeof m.bars === "number");
  const pool = inSection.length ? inSection.map(m => ({ ...m, section: section.title })) : flattenDanceMovements(dance).filter(m => typeof m.bars === "number");
  if (!pool.length) return null; // nothing numeric stated anywhere — don't fabricate, just skip this component
  const target = pool[Math.floor(Math.random() * pool.length)];
  return {
    type: "single",
    prompt: `How many bars is the movement "${target.english}" (${target.section})?`,
    correctAnswer: target.bars,
  };
}

function pickReadingQuestion(avoidDanceId) {
  const data = getReadingData();
  const candidates = [];
  data.forEach(dance => {
    dance.sections.forEach(section => {
      if (section.movements.length >= 2) candidates.push({ dance, section });
    });
  });
  let pool = candidates.filter(c => c.dance.id !== avoidDanceId);
  if (!pool.length) pool = candidates; // only happens if the dataset were tiny; guards against a dead end
  const pick = pool[Math.floor(Math.random() * pool.length)];

  const correctOrder = pick.section.movements.map(m => ({ ...m, section: pick.section.title }));
  const shuffled = shuffleMovementsForQuestion(correctOrder);
  const barsQuestion = buildBarsQuestion(pick.dance, pick.section);

  return { dance: pick.dance, section: pick.section, correctOrder, shuffled, barsQuestion };
}

function startStudyQuestion(mode, avoidDanceId) {
  const q = pickReadingQuestion(avoidDanceId);
  studySession = {
    mode,
    dance: q.dance,
    section: q.section,
    correctOrder: q.correctOrder,
    userOrder: q.shuffled.slice(),
    barsQuestion: q.barsQuestion,
    nameInput: "",
    barsInput: "",
    submitted: false,
    result: null,
  };
}

function renderReadingModeSelect() {
  mount(h("div", {}, [
    topbar(),
    modeBanner("reading", "Reading Mode", "Study the Dances", "Practice dance names, movements, bars, and order."),
    page([
      h("div", { class: "centered-page-header" }, [
        p_lede("Every question is pulled at random from all 30 dances — the same dance can come up again later, but its movement order is reshuffled fresh each time."),
      ]),

      h("div", { class: "reading-section-heading" }, ["Practice"]),
      h("div", { class: "mode-grid reading-choice-grid" }, [
        h("button", { class: "mode-card mode-card--accent-thread", onClick: () => location.hash = "#/reading/study/easy" }, [
          h("div", { class: "mode-card__title" }, ["Easy Mode"]),
          h("p", { class: "mode-card__desc" }, [
            "Practice arranging the movements in the correct order — the dance name and every movement's bar count are given."
          ]),
          h("span", { class: "mode-card__cta" }, ["Start Easy →"]),
        ]),
        h("button", { class: "mode-card mode-card--accent-brass", onClick: () => location.hash = "#/reading/study/hard" }, [
          h("div", { class: "mode-card__title" }, ["Hard Mode"]),
          h("p", { class: "mode-card__desc" }, [
            "Test your recall of the dance name, a bar count, and the correct movement order — all from memory."
          ]),
          h("span", { class: "mode-card__cta" }, ["Start Hard →"]),
        ]),
      ]),

      h("div", { class: "reading-section-heading" }, ["Browse"]),
      h("div", { class: "mode-grid reading-choice-grid reading-choice-grid--single" }, [
        h("button", { class: "mode-card mode-card--accent-leaf", onClick: () => location.hash = "#/reading/browse" }, [
          h("div", { class: "mode-card__title" }, ["Browse all 30 dances"]),
          h("p", { class: "mode-card__desc" }, [
            "Review all 30 dances, their movements, and bar counts — without taking a quiz."
          ]),
          h("span", { class: "mode-card__cta" }, ["Browse dances →"]),
        ]),
      ]),
    ]),
    footer(),
  ]));
}

function renderReadingStudy(mode) {
  if (!studySession || studySession.mode !== mode) startStudyQuestion(mode, null);
  mount(h("div", {}, [
    topbar(),
    page([
      crumb(`Reading Mode / ${mode === "easy" ? "Easy Mode" : "Hard Mode"}`),
      h("h1", { class: "page-title" }, [mode === "easy" ? "Easy Mode" : "Hard Mode"]),
      p_lede(mode === "easy"
        ? "The dance name and each movement's bars are shown — reorder the movements to match the book."
        : "Type the dance name and the bar count from memory, then reorder the movements."),
      readingModeMenu("study"),
      h("div", { id: "study-container" }, []),
    ]),
    footer(),
  ]));
  paintStudyScreen();
}

function paintStudyScreen() {
  const container = document.getElementById("study-container");
  if (!container) return;
  container.innerHTML = "";
  container.appendChild(studySession.submitted ? renderStudyResult() : renderStudyQuestion());
}

function fieldLabel(text) {
  return h("label", { class: "field-label" }, [text]);
}

function renderStudyQuestion() {
  const s = studySession;
  const children = [];
  let stepNum = 1;

  if (s.mode === "easy") {
    children.push(h("div", { class: "card study-dance-card" }, [
      h("div", { class: "field-label" }, ["Dance"]),
      h("div", { class: "study-dance-name" }, [s.dance.englishName]),
      h("div", { class: "study-dance-sub" }, [`${s.dance.irishName} · ${s.section.title}`]),
    ]));
  } else {
    children.push(h("div", { class: "card" }, [
      fieldLabel(`${stepNum++}. What dance is this? (English name is enough)`),
      h("input", {
        class: "text-input", placeholder: "e.g. Walls of Limerick", value: s.nameInput,
        oninput: (e) => { s.nameInput = e.target.value; },
      }, []),
      h("div", { style: "font-size:0.8rem; color:#8a7a86; margin-top:6px;" }, [
        s.section.title === "Movements"
          ? "(You're being shown its movements below.)"
          : `(You're being shown its "${s.section.title}" movements below.)`
      ]),
    ]));

    if (s.barsQuestion) {
      children.push(h("div", { class: "card" }, [
        fieldLabel(`${stepNum++}. ${s.barsQuestion.prompt}`),
        h("input", {
          class: "text-input", type: "text", inputmode: "numeric", placeholder: "Number of bars", value: s.barsInput,
          oninput: (e) => { s.barsInput = e.target.value; },
        }, []),
      ]));
    }
  }

  children.push(h("div", { class: "card" }, [
    fieldLabel(`${s.mode === "hard" ? stepNum + ". " : ""}Arrange the movements in the correct order${s.section.title === "Movements" ? "" : ` (${s.section.title})`}`),
    renderMovementOrderer(),
  ]));

  children.push(h("div", { class: "btn-row" }, [
    h("button", { class: "btn btn--brass btn--big", onClick: submitStudyAnswer }, ["Check answer"]),
  ]));

  return h("div", {}, children);
}

function renderMovementOrderer() {
  const s = studySession;
  const rows = s.userOrder.map((m, i) => h("div", { class: "orderer-row", id: "orderer-row-" + i }, [
    h("div", { class: "orderer-row__num" }, [String(i + 1)]),
    h("div", { class: "orderer-row__content" }, [
      h("div", { class: "orderer-row__irish" }, [m.irish]),
      h("div", { class: "orderer-row__english" }, [m.english]),
      s.mode === "easy" ? h("div", { class: "orderer-row__bars" }, [
        typeof m.bars === "number" ? `${m.bars} bars` : "bars not stated in source"
      ]) : null,
    ]),
    h("div", { class: "orderer-row__controls" }, [
      h("button", { class: "orderer-btn", disabled: i === 0, "aria-label": `Move "${m.english}" up`, onClick: () => moveMovement(i, -1) }, ["↑"]),
      h("button", { class: "orderer-btn", disabled: i === s.userOrder.length - 1, "aria-label": `Move "${m.english}" down`, onClick: () => moveMovement(i, 1) }, ["↓"]),
    ]),
  ]));
  return h("div", { class: "orderer-list" }, rows);
}

function moveMovement(index, dir) {
  const s = studySession;
  const newIndex = index + dir;
  if (newIndex < 0 || newIndex >= s.userOrder.length) return;
  const arr = s.userOrder;
  const tmp = arr[index]; arr[index] = arr[newIndex]; arr[newIndex] = tmp;
  paintStudyScreen();
  // Brief, purposeful highlight on the two rows that just swapped — this is
  // the "visual feedback when a movement is being moved" the design calls
  // for, not decoration: without it, a swap just teleports with no cue that
  // anything happened. Respects prefers-reduced-motion via the CSS itself.
  [index, newIndex].forEach(pos => {
    const el = document.getElementById("orderer-row-" + pos);
    if (!el) return;
    el.classList.add("orderer-row--moved");
    setTimeout(() => el.classList.remove("orderer-row--moved"), 450);
  });
}

function submitStudyAnswer() {
  const s = studySession;
  const result = { orderCorrect: sameMovementOrder(s.userOrder, s.correctOrder) };

  if (s.mode === "hard") {
    result.nameCorrect = checkDanceNameAnswer(s.nameInput, s.dance);
    if (s.barsQuestion) {
      const parsed = parseInt(String(s.barsInput).replace(/[^0-9-]/g, ""), 10);
      result.barsCorrect = !isNaN(parsed) && parsed === s.barsQuestion.correctAnswer;
    } else {
      result.barsCorrect = null; // not applicable for this dance — not scored
    }
  }

  s.result = result;
  s.submitted = true;
  paintStudyScreen();
}

function resultLine(label, correct) {
  if (correct === null) {
    return h("div", { class: "result-line" }, [
      h("span", { style: "font-weight:600;" }, [label]),
      h("span", { style: "font-family:var(--font-mono); color:#9a8b96;" }, ["N/A for this dance"]),
    ]);
  }
  return h("div", { class: "result-line" }, [
    h("span", { style: "font-weight:600;" }, [label]),
    h("span", { style: `font-family:var(--font-mono); color:${correct ? "var(--leaf)" : "var(--thread)"};` }, [correct ? "✓ Correct" : "✕ Incorrect"]),
  ]);
}

function orderList(list, compareAgainst, showBars) {
  return h("ol", { class: "order-compare-list" }, list.map((m, i) => {
    const mismatch = compareAgainst ? !(compareAgainst[i] && compareAgainst[i].irish === m.irish) : false;
    return h("li", { class: mismatch ? "order-compare-list__item order-compare-list__item--mismatch" : "order-compare-list__item" }, [
      // Non-color cue alongside the color (accessibility: never rely on
      // color alone) — a small ✕ marks a wrong slot, a quiet ✓ confirms a
      // right one, only shown once we actually have something to compare.
      compareAgainst ? h("span", { class: "order-compare-list__mark", "aria-hidden": "true" }, [mismatch ? "✕ " : "✓ "]) : null,
      `${m.english}` + (showBars && typeof m.bars === "number" ? ` (${m.bars} bars)` : "")
    ]);
  }));
}

function renderOrderComparison() {
  const s = studySession;
  const showBars = s.mode === "easy";
  if (s.result.orderCorrect) {
    return h("div", { class: "card" }, [
      h("div", { class: "field-label" }, ["Order"]),
      orderList(s.correctOrder, null, showBars),
    ]);
  }
  return h("div", { class: "card" }, [
    h("div", { class: "order-compare-grid" }, [
      h("div", {}, [
        h("div", { class: "field-label", style: "color:var(--thread);" }, ["Your order"]),
        orderList(s.userOrder, s.correctOrder, showBars),
      ]),
      h("div", {}, [
        h("div", { class: "field-label", style: "color:var(--leaf);" }, ["Correct order"]),
        orderList(s.correctOrder, null, showBars),
      ]),
    ]),
  ]);
}

function renderStudyResult() {
  const s = studySession;
  const children = [];

  if (s.mode === "easy") {
    children.push(h("div", {
      class: "card",
      style: `border-left:4px solid ${s.result.orderCorrect ? "var(--leaf)" : "var(--thread)"};`,
    }, [
      h("div", { style: `font-family:var(--font-display); font-size:1.4rem; font-weight:600; color:${s.result.orderCorrect ? "var(--leaf)" : "var(--thread)"};` }, [
        s.result.orderCorrect ? "✓ Correct!" : "✕ Not quite."
      ]),
    ]));
  } else {
    children.push(h("div", { class: "card" }, [
      h("div", { style: "font-size:0.85rem; color:#6b5c67; margin-bottom:10px;" }, [
        `This round: ${s.dance.englishName} (${s.dance.irishName}) — ${s.section.title}`
      ]),
      resultLine("Dance Name", s.result.nameCorrect),
      s.barsQuestion ? resultLine("Number of Bars", s.result.barsCorrect) : resultLine("Number of Bars", null),
      resultLine("Movement Order", s.result.orderCorrect),
    ]));
  }

  children.push(renderOrderComparison());

  if (s.mode === "hard" && !s.result.nameCorrect) {
    children.push(h("div", { class: "notes-box" }, [`Correct dance: ${s.dance.englishName} (${s.dance.irishName})`]));
  }
  if (s.mode === "hard" && s.barsQuestion && !s.result.barsCorrect) {
    children.push(h("div", { class: "notes-box" }, [`Correct answer: ${s.barsQuestion.correctAnswer} bars. Question was: ${s.barsQuestion.prompt}`]));
  }

  children.push(h("div", { class: "btn-row" }, [
    h("button", { class: "btn btn--brass btn--big", onClick: () => {
      const prevId = s.dance.id;
      startStudyQuestion(s.mode, prevId);
      renderReadingStudy(s.mode);
    }}, ["Next question →"]),
  ]));

  return h("div", {}, children);
}


// ================================================================
// MUSIC MODE
// ================================================================

// ---------------- Music Mode persistent shell ----------------
// All three Music Mode activities (Listen & Identify, Browse Tunes,
// Metadata Quiz) share ONE persistent header, banner, and tab bar.
// Switching between them updates only the inner content area (with a
// brief fade), instead of tearing down and rebuilding the whole page —
// this is what makes tab switches feel like moving within one workspace
// rather than navigating to a different page.
//
// The shell (topbar, mode banner, back button, tab bar) is built once via
// mount() the first time any Music Mode route renders after arriving from
// somewhere else, and reused in place for every subsequent switch between
// its own three tabs. Leaving Music Mode entirely (Back to Home, Reading
// Mode, anywhere else) destroys it via that destination's own normal
// mount() call; returning later rebuilds the shell fresh. There's no
// separate "is the shell still valid" flag to maintain — checking
// document.getElementById is itself always accurate and self-correcting.
const MUSIC_TABS = [
  ["listen", "Listen & Identify", "#/music", "Listen to a tune, identify it, then reveal the song's name, time signature, step, and set."],
  ["browse", "Browse tunes", "#/music/browse", "Browse the tunes in the collection and review their names, time signatures, steps, and sets."],
  ["quiz", "Metadata quiz", "#/music/quiz", "Test your knowledge of tune details such as time signature, step, and set."],
];

function musicModeMenu(active) {
  const activeItem = MUSIC_TABS.find(i => i[0] === active);
  return h("div", { class: "tab-strip-group" }, [
    h("div", { class: "tab-strip tab-strip--music" }, MUSIC_TABS.map(([key, label, url]) =>
      h("button", {
        "aria-current": String(active === key),
        "data-tab-key": key,
        onClick: () => location.hash = url,
      }, [label])
    )),
    h("p", { class: "tab-strip__hint", id: "music-tab-hint" }, [activeItem ? activeItem[3] : ""]),
  ]);
}

// Mutates the EXISTING tab buttons in place, rather than replacing them,
// so the CSS transition on the active-tab underline can actually animate —
// a freshly rebuilt element has no "previous state" for the browser to
// transition from, so instant-replace would defeat requirement #4
// (smooth active-tab transition, not an instant jump).
function updateMusicShellTabs(activeTab) {
  const strip = document.querySelector(".tab-strip--music");
  if (!strip) return;
  strip.querySelectorAll("button").forEach(btn => {
    btn.setAttribute("aria-current", String(btn.dataset.tabKey === activeTab));
  });
  const hint = document.getElementById("music-tab-hint");
  const activeItem = MUSIC_TABS.find(i => i[0] === activeTab);
  if (hint && activeItem) hint.textContent = activeItem[3];
}

// Renders `contentNode` into Music Mode's shared activity area. If the
// shell doesn't exist yet (first arrival from outside Music Mode, or a
// fresh page load on a music route), builds it once via the normal
// mount(). If it already exists (switching between Music Mode's own
// tabs, or a filter click within Browse), updates only the tab indicators
// and the content area — with a brief fade — leaving the topbar, banner,
// and back button completely untouched in the DOM the whole time.
function renderMusicShell(activeTab, contentNode) {
  const existingShell = document.getElementById("music-shell");
  const content = document.getElementById("music-activity-content");

  if (existingShell && content) {
    updateMusicShellTabs(activeTab);
    content.classList.add("music-activity-content--out");
    setTimeout(() => {
      content.innerHTML = "";
      content.appendChild(contentNode);
      void content.offsetWidth; // force layout so removing the class below actually transitions, rather than collapsing straight through
      content.classList.remove("music-activity-content--out");
    }, 130);
    return;
  }

  mount(h("div", { id: "music-shell" }, [
    topbar(),
    modeBanner("music", "Music Mode", "Practice the Tunes", "Listen, identify, and test your knowledge of the exam tunes."),
    page([
      musicModeMenu(activeTab),
      h("div", { id: "music-activity-content" }, [contentNode]),
    ]),
    footer(),
  ]));
}

// ---------------- Listen & Identify (the primary Music Mode experience) ----------------
//
// SESSION BEHAVIOR: a fresh shuffled session is created every time the user
// *navigates into* Music Mode's root route (#/music) — including returning
// to it after visiting Browse Tunes or the Metadata Quiz, or after leaving
// the app entirely. Card flips and Next/Previous do NOT re-shuffle — they
// just move a pointer through the one fixed random order for this session,
// per spec.

let musicSession = null;

function startNewMusicSession() {
  const data = getMusicData();
  const playable = data.filter(t => t.spotify && (t.matchStatus === "matched-exact" || t.matchStatus === "matched-fuzzy"));
  musicSession = {
    deck: Quiz.shuffle(playable),
    index: 0,
    flipped: false,
    excludedCount: data.length - playable.length,
  };
}

function renderMusicHub() {
  startNewMusicSession();
  // Kick off the Spotify controller setup the instant Music Mode is
  // entered — while the user is still reading the card, not after their
  // first tap — and preload this session's first card into it. Both calls
  // are safe to make every time (including returning after leaving): warmUp
  // is a no-op once the controller already exists, and preload() just skips
  // straight to loading this track since the controller is already there.
  if (musicSession.deck.length) {
    SpotifyPlayer.warmUp();
    SpotifyPlayer.preload(musicSession.deck[0].spotify.trackId);
  }
  const content = h("div", {}, [
    p_lede(
      musicSession.deck.length
        ? `Press play, guess the tune from the music, then reveal the answer.` +
          (musicSession.excludedCount ? ` (${musicSession.excludedCount} tune${musicSession.excludedCount === 1 ? "" : "s"} not yet matched to a Spotify track, so ${musicSession.excludedCount === 1 ? "it's" : "they're"} excluded here — see Browse Tunes.)` : "")
        : `No tunes are matched to audio yet.`
    ),
    musicSession.deck.length ? renderListenSession() : h("div", { class: "empty-state" }, [
      "Nothing to play yet — no tunes are matched to audio. See Browse Tunes for the full reference list."
    ]),
  ]);
  renderMusicShell("listen", content);
}

function renderListenSession() {
  const container = h("div", { id: "audio-session" }, []);
  paintMusicCard(container);
  return container;
}

function getCurrentTune() { return musicSession.deck[musicSession.index]; }

function sessionProgressRow() {
  const dots = musicSession.deck.map((_, i) =>
    h("span", { class: "session-progress__dot"
      + (i === musicSession.index ? " session-progress__dot--current" : i < musicSession.index ? " session-progress__dot--done" : "") }, [])
  );
  return h("div", { class: "session-progress" }, [
    `Tune ${musicSession.index + 1} of ${musicSession.deck.length}`,
    h("span", { class: "session-progress__dots" }, dots),
  ]);
}

function playIconSvg(status) {
  if (status === "playing") {
    return `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>`;
  }
  if (status === "connecting") {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8" stroke-dasharray="38" stroke-dashoffset="12"/></svg>`;
  }
  if (status === "error") {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v8" stroke-linecap="round"/><circle cx="12" cy="17" r="1" fill="currentColor" stroke="none"/></svg>`;
  }
  return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
}

function playbackStatusLabel(state) {
  if (state.status === "playing") return "Playing — tap to pause";
  if (state.status === "connecting") return "Preparing audio…";
  if (state.status === "paused") return "Paused — tap to resume";
  if (state.status === "error") return "Couldn't start playback — tap to retry";
  return "Tap to listen";
}

function metaCell(label, value) {
  return h("div", { class: "audio-meta-cell" }, [
    h("span", { class: "audio-meta-cell__label" }, [label]),
    h("span", { class: "audio-meta-cell__value" }, [value]),
  ]);
}

function toggleMusicPlayback(tune) {
  const state = SpotifyPlayer.getStateFor(tune.spotify.trackId);
  if (state.status === "playing") SpotifyPlayer.pause();
  else if (state.status === "error") SpotifyPlayer.retry(tune.spotify.trackId);
  else SpotifyPlayer.play(tune.spotify.trackId);
}

function renderCardFront(tune) {
  const state = SpotifyPlayer.getStateFor(tune.spotify.trackId);

  if (SpotifyPlayer.isFallback()) {
    return h("div", { class: "audio-face audio-face--front" }, [
      h("div", { class: "audio-face__eyebrow" }, ["LISTEN & GUESS"]),
      h("div", { class: "audio-face__status" }, ["Custom player unavailable — using Spotify's own widget below."]),
      spotifyEmbed(tune.spotify.trackId),
      h("div", { class: "audio-fallback-note" }, ["Falling back to Spotify's embedded player (the enhanced controls script didn't load)."]),
      h("button", { class: "btn btn--ghost", onClick: (e) => { e.stopPropagation(); flipMusicCard(); } }, ["Reveal answer ↓"]),
    ]);
  }

  const btn = h("button", {
    class: "audio-playbtn"
      + (state.status === "playing" ? " audio-playbtn--playing" : "")
      + (state.status === "error" ? " audio-playbtn--error" : ""),
    "aria-label": state.status === "playing" ? "Pause" : state.status === "error" ? "Retry" : "Play",
    disabled: state.status === "connecting",
    onClick: (e) => { e.stopPropagation(); toggleMusicPlayback(tune); },
  }, []);
  btn.innerHTML = playIconSvg(state.status); // set after h() so the click listener above stays attached

  return h("div", { class: "audio-face audio-face--front" }, [
    h("div", { class: "audio-face__eyebrow" }, ["LISTEN & GUESS"]),
    btn,
    h("div", { class: "audio-face__status" + (state.status === "error" ? " audio-face__status--error" : "") }, [playbackStatusLabel(state)]),
    h("button", { class: "btn btn--ghost", onClick: (e) => { e.stopPropagation(); flipMusicCard(); } }, ["Reveal answer ↓"]),
  ]);
}

// Shared with the front button so the label/state is NEVER out of sync with
// reality — e.g. if the track is already playing when the user flips to the
// back, this reads "Pause", not a stale "Play again".
function miniPlaybackLabel(state) {
  if (SpotifyPlayer.isFallback()) return "Use the player above";
  if (state.status === "playing") return "⏸ Pause";
  if (state.status === "connecting") return "Preparing…";
  if (state.status === "paused") return "▶ Resume";
  if (state.status === "error") return "⚠ Retry";
  return "▶ Play again";
}

function renderCardBack(tune) {
  const state = SpotifyPlayer.getStateFor(tune.spotify.trackId);
  return h("div", { class: "audio-face audio-face--back" }, [
    h("div", { class: "audio-face__eyebrow" }, ["ANSWER"]),
    h("div", { class: "audio-face__name" }, [tune.name]),
    h("div", { class: "audio-meta-grid" }, [
      metaCell("Time signature", tune.timeSignature),
      metaCell("Step", `${tune.stepBars} bars`),
      metaCell("Set", `${tune.setBars} bars`),
      metaCell("Tune type", tune.tuneType),
    ]),
    SpotifyPlayer.isFallback() ? null : h("button", {
      class: "mini-btn", disabled: state.status === "connecting",
      onClick: (e) => { e.stopPropagation(); toggleMusicPlayback(tune); },
    }, [miniPlaybackLabel(state)]),
    h("button", { class: "btn btn--ghost", style: "margin-top:4px;", onClick: (e) => { e.stopPropagation(); flipMusicCard(); } }, ["← Hide answer"]),
  ]);
}

function sessionControls() {
  return h("div", { class: "btn-row", style: "justify-content:center; margin-top:18px;" }, [
    h("button", { class: "btn btn--ghost", disabled: musicSession.index === 0, onClick: prevMusicCard }, ["← Previous"]),
    h("button", { class: "btn btn--brass btn--big", onClick: nextMusicCard }, ["Next tune →"]),
  ]);
}

function paintMusicCard(container) {
  container = container || document.getElementById("audio-session");
  if (!container) return; // user navigated away from Music Mode
  container.innerHTML = "";
  const tune = getCurrentTune();

  container.appendChild(sessionProgressRow());

  const card = h("div", { class: "audio-card", onClick: () => flipMusicCard() }, [
    musicSession.flipped ? renderCardBack(tune) : renderCardFront(tune),
  ]);
  container.appendChild(card);
  container.appendChild(sessionControls());
}

function flipMusicCard() {
  musicSession.flipped = !musicSession.flipped;
  paintMusicCard();
}

function nextMusicCard() {
  SpotifyPlayer.pause();
  musicSession.index = (musicSession.index + 1) % musicSession.deck.length;
  musicSession.flipped = false;
  paintMusicCard();
  preloadCurrentCard();
}

function prevMusicCard() {
  if (musicSession.index === 0) return;
  SpotifyPlayer.pause();
  musicSession.index -= 1;
  musicSession.flipped = false;
  paintMusicCard();
  preloadCurrentCard();
}

// Load whichever card is now on screen into the (single, reused) Spotify
// controller ahead of time, without playing it — so if/when the user
// presses Play, it's usually already loaded and only needs to start.
function preloadCurrentCard() {
  const tune = musicSession.deck[musicSession.index];
  if (tune && tune.spotify) SpotifyPlayer.preload(tune.spotify.trackId);
}

// Repaint whenever real playback state changes (e.g. Spotify reports the
// track actually started), regardless of what triggered it — this is what
// keeps the UI honest rather than assuming a click succeeded.
SpotifyPlayer.onChange(() => { paintMusicCard(); paintQuizAudioPlayer(); });

function statusPill(status) {
  const map = {
    "matched-exact": ["Matched", "status-pill--exact"],
    "matched-fuzzy": ["Matched (check)", "status-pill--fuzzy"],
    "unmatched": ["Unmatched", "status-pill--unmatched"],
  };
  const [label, cls] = map[status] || ["Unknown", "status-pill--unmatched"];
  return h("span", { class: "status-pill " + cls }, [label]);
}

function spotifyEmbed(trackId) {
  return h("div", { class: "embed-wrap" }, [
    h("iframe", {
      src: `https://open.spotify.com/embed/track/${trackId}`,
      width: "100%", height: "80", frameborder: "0",
      allow: "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture",
      loading: "lazy",
    }, []),
  ]);
}

let musicFilter = "all";

function renderMusicBrowse() {
  const data = getMusicData();
  const filtered = musicFilter === "all" ? data
    : musicFilter === "unmatched" ? data.filter(t => t.matchStatus === "unmatched")
    : data.filter(t => t.tuneType === musicFilter);

  const tuneTypes = [...new Set(data.map(t => t.tuneType))];

  const content = h("div", {}, [
    p_lede("Names and bar counts come from the reference document; press ▶ to hear the matched Spotify track."),
    h("div", { class: "filter-bar" }, [
      h("button", { class: "filter-chip", "aria-pressed": String(musicFilter === "all"), onClick: () => { musicFilter = "all"; renderMusicBrowse(); } }, ["All"]),
      ...tuneTypes.map(tt => h("button", { class: "filter-chip", "aria-pressed": String(musicFilter === tt), onClick: () => { musicFilter = tt; renderMusicBrowse(); } }, [tt])),
      h("button", { class: "filter-chip", "aria-pressed": String(musicFilter === "unmatched"), onClick: () => { musicFilter = "unmatched"; renderMusicBrowse(); } }, ["Unmatched only"]),
    ]),
    h("div", { class: "table-scroll" }, [
      h("table", { class: "tunes" }, [
        h("thead", {}, [h("tr", {}, [
          h("th", {}, ["Name"]), h("th", {}, ["Type"]), h("th", {}, ["Time sig."]),
          h("th", {}, ["Step"]), h("th", {}, ["Set"]), h("th", {}, ["Audio"]),
        ])]),
        h("tbody", {}, filtered.map(t => h("tr", {}, [
          h("td", { class: "name" }, [t.name]),
          h("td", {}, [t.tuneType]),
          h("td", {}, [t.timeSignature]),
          h("td", {}, [String(t.stepBars)]),
          h("td", {}, [String(t.setBars)]),
          h("td", {}, [t.spotify
            ? h("button", { class: "play-btn", onClick: (e) => togglePlay(e, t) }, ["▶ Play"])
            : statusPill("unmatched")]),
        ]))),
      ]),
    ]),
  ]);
  renderMusicShell("browse", content);
}

function togglePlay(e, tune) {
  const cell = e.target.closest("td");
  if (cell.querySelector("iframe")) { cell.innerHTML = ""; cell.appendChild(e.target); return; }
  cell.innerHTML = "";
  cell.appendChild(spotifyEmbed(tune.spotify.trackId));
}

// ---------- Music quiz ----------

let musicQuizState = null;

function renderMusicQuiz() {
  if (!musicQuizState || musicQuizState.index >= musicQuizState.questions.length) {
    return renderMusicQuizIntro();
  }
  renderMusicQuizQuestion();
}

function renderMusicQuizIntro() {
  const content = h("div", {}, [
    p_lede("Metadata questions (time signature, step & set bars, tune type) plus listen-and-identify questions for tunes with a matched track."),
    h("div", { class: "btn-row" }, [
      h("button", { class: "btn", onClick: () => { musicQuizState = { questions: Quiz.generateMusicQuiz(getMusicData(), 12, false), index: 0, score: 0, answered: false }; router(); } }, ["Start metadata quiz (12 Qs)"]),
      h("button", { class: "btn btn--brass", onClick: () => { musicQuizState = { questions: Quiz.generateMusicQuiz(getMusicData(), 10, true), index: 0, score: 0, answered: false }; router(); } }, ["Start listen-and-identify quiz"]),
    ]),
  ]);
  renderMusicShell("quiz", content);
}

// Title-free playback control for the Metadata Quiz's listen-and-identify
// questions. Deliberately does NOT reuse spotifyEmbed() (see comment at its
// call site) — instead drives the same hidden, off-screen SpotifyPlayer
// controller already used by Listen & Identify, with our own custom button
// that never displays the track name anywhere (not in text, not in a title
// attribute, not in an aria-label — the button's accessible name is always
// the generic "Play"/"Pause", identical to the front of a Listen & Identify
// flashcard before it's flipped).
function renderQuizAudioPlayer(trackId) {
  const container = h("div", { id: "quiz-audio-player" }, []);
  container.dataset.trackId = trackId;
  paintQuizAudioPlayer(container);
  return container;
}

function paintQuizAudioPlayer(container) {
  container = container || document.getElementById("quiz-audio-player");
  if (!container) return;
  const trackId = container.dataset.trackId;
  container.innerHTML = "";

  if (SpotifyPlayer.isFallback()) {
    // Honest limitation, not a silent failure: Spotify's plain oEmbed
    // widget (the only fallback when the enhanced-controls script can't
    // load) always shows its own track title as part of Spotify's UI —
    // there is no supported way to suppress that in the basic embed.
    // Playback still works; we just can't promise the title stays hidden
    // in this specific fallback scenario.
    container.appendChild(h("div", { class: "quiz-audio-fallback-note" }, [
      "Note: the title-free player isn't available right now, so this question falls back to Spotify's standard embed below — which may show the track name. Playback still works normally."
    ]));
    container.appendChild(spotifyEmbed(trackId));
    return;
  }

  const state = SpotifyPlayer.getStateFor(trackId);
  const btn = h("button", {
    class: "audio-playbtn quiz-playbtn"
      + (state.status === "playing" ? " audio-playbtn--playing" : "")
      + (state.status === "error" ? " audio-playbtn--error" : ""),
    "aria-label": state.status === "playing" ? "Pause" : state.status === "error" ? "Retry" : "Play",
    disabled: state.status === "connecting",
    onClick: (e) => { e.stopPropagation(); toggleQuizPlayback(trackId); },
  }, []);
  btn.innerHTML = playIconSvg(state.status);

  container.appendChild(h("div", { class: "quiz-audio-player" }, [
    btn,
    h("div", { class: "quiz-audio-player__status" }, [playbackStatusLabel(state)]),
  ]));
}

function toggleQuizPlayback(trackId) {
  const state = SpotifyPlayer.getStateFor(trackId);
  if (state.status === "playing") SpotifyPlayer.pause();
  else if (state.status === "error") SpotifyPlayer.retry(trackId);
  else SpotifyPlayer.play(trackId);
}

function renderMusicQuizQuestion() {
  const state = musicQuizState;
  if (!state.questions.length) {
    const emptyContent = h("div", {}, [
      h("div", { class: "empty-state" }, ["No tunes are matched to audio right now — try the metadata quiz instead, or Listen & Identify once matches are available."]),
      h("button", { class: "btn", onClick: () => location.hash = "#/music/quiz" }, ["Back"]),
    ]);
    return renderMusicShell("quiz", emptyContent);
  }
  const q = state.questions[state.index];

  const body = [
    h("div", { class: "quiz-progress" }, [
      h("span", { class: "quiz-score" }, [`Question ${state.index + 1} of ${state.questions.length}`]),
      h("span", { class: "quiz-score" }, [`Score: ${state.score}/${state.index}`]),
    ]),
    h("div", { class: "quiz-question" }, [q.prompt]),
  ];
  if (q.type === "audio-id") {
    // IMPORTANT: never use spotifyEmbed() (Spotify's own branded oEmbed
    // iframe) here — it always visually displays the track title/artist as
    // part of Spotify's own UI, which would hand the answer straight to the
    // user before they've guessed. Use the same title-free hidden-controller
    // player already built for Listen & Identify instead (see
    // renderQuizAudioPlayer below) — real playback, no title shown, because
    // the controller iframe itself is never rendered on screen.
    SpotifyPlayer.preload(q.meta.trackId);
    body.push(renderQuizAudioPlayer(q.meta.trackId));
  }
  body.push(h("div", { class: "quiz-options", id: "music-options" }, q.options.map((opt, i) =>
    h("button", { class: "quiz-option", disabled: state.answered, onClick: () => answerMusicQuiz(i) }, [opt])
  )));
  body.push(h("div", { id: "music-feedback" }, []));

  renderMusicShell("quiz", h("div", {}, body));
}

function answerMusicQuiz(chosenIndex) {
  const state = musicQuizState;
  const q = state.questions[state.index];
  state.answered = true;
  const correct = chosenIndex === q.correctIndex;
  if (correct) state.score += 1;

  const optionsWrap = document.getElementById("music-options");
  Array.from(optionsWrap.children).forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correctIndex) btn.classList.add("quiz-option--correct");
    else if (i === chosenIndex) btn.classList.add("quiz-option--wrong");
  });

  const feedback = document.getElementById("music-feedback");
  feedback.innerHTML = "";
  feedback.appendChild(h("div", { class: "quiz-feedback" }, [
    correct ? h("strong", { class: "correct-text" }, ["Correct. "])
            : h("span", {}, [h("strong", { class: "wrong-text" }, ["Not quite. "]), `Correct answer: ${q.options[q.correctIndex]}. `]),
  ]));
  feedback.appendChild(h("div", { class: "btn-row" }, [
    h("button", { class: "btn", onClick: nextMusicQuizQuestion }, [
      state.index + 1 < state.questions.length ? "Next question →" : "See results →"
    ]),
  ]));
}

function nextMusicQuizQuestion() {
  SpotifyPlayer.pause(); // stop any audio-id playback before showing a new (possibly unrelated) question
  musicQuizState.index += 1;
  musicQuizState.answered = false;
  if (musicQuizState.index >= musicQuizState.questions.length) {
    Store.recordQuizResult("music", musicQuizState.score, musicQuizState.questions.length);
    return renderMusicQuizSummary();
  }
  renderMusicQuizQuestion();
}

function renderMusicQuizSummary() {
  const state = musicQuizState;
  const pct = Math.round((state.score / state.questions.length) * 100);
  const content = h("div", { class: "quiz-summary" }, [
    h("div", {}, ["You scored"]),
    h("div", { class: "quiz-summary__score" }, [`${state.score} / ${state.questions.length}`]),
    h("div", {}, [`${pct}% this round`]),
    h("div", { class: "btn-row", style: "justify-content:center;" }, [
      h("button", { class: "btn", onClick: () => location.hash = "#/music/quiz" }, ["Back to quiz menu"]),
    ]),
  ]);
  renderMusicShell("quiz", content);
}


</script>
