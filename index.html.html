<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Céilí Prep — Irish Dancing Test Practice</title>
<meta name="description" content="Practice Irish céilí dance movements, bar counts, and set-dance music for the CLRG knowledge test.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   DESIGN TOKENS
   Palette drawn from the source book itself: the deep purple/gold
   cover of "Ár Rincí Céilí" and its warm cream pages — not a generic
   green-shamrock treatment.
   ============================================================ */
:root {
  --ink:          #241626;
  --plum:         #3B1F4D;
  --plum-deep:    #2A1638;
  --plum-tint:    #EFE7F1;
  --brass:        #A8802F;
  --brass-light:  #D9BC72;
  --thread:       #A8433D;
  --thread-tint:  #F5E4E1;
  --leaf:         #4C6B4F;
  --leaf-tint:    #E6EDE3;
  --paper:        #FBF7EF;
  --paper-raised: #F3ECDC;
  --line:         #DDD2BC;
  --reading-wash: #F3E4D3; /* warm parchment tint — Reading Mode's own environment color, distinct from Home's plain --paper */

  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;

  --radius: 10px;
  --shadow: 0 1px 2px rgba(36, 22, 38, 0.06), 0 6px 20px rgba(36, 22, 38, 0.07);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

body {
  background-image:
    radial-gradient(circle at 1px 1px, rgba(59,31,77,0.05) 1px, transparent 0);
  background-size: 22px 22px;
  transition: background-color 0.2s ease;
}
/* Each mode gets its own subtle environment tint (not just its header) —
   set once, centrally, via a data-attribute the router toggles, rather
   than threading a class through every individual screen. Home/no-mode
   stays the plain --paper background. */
body[data-mode="reading"] { background-color: #FAF2E7; }
body[data-mode="music"] { background-color: #FAF8FB; }

#app { min-height: 100vh; }

a { color: inherit; }

::selection { background: var(--brass-light); color: var(--ink); }

:focus-visible {
  outline: 3px solid var(--brass);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------------- Layout shells ---------------- */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 20px;
  background: var(--plum);
  color: var(--paper);
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: var(--shadow);
}

.topbar__brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  text-decoration: none;
  color: var(--paper);
}
.topbar__brand small {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--brass-light);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* Reorganize, don't just shrink: on phone widths the subtitle is pure
   branding (not information the user needs), so it hides to keep the
   brand line compact and clean. */
@media (max-width: 480px) {
  .topbar { padding: 12px 14px; gap: 8px; }
  .topbar__brand small { display: none; }
  .topbar__brand { font-size: 1rem; }
}

.page {
  max-width: 980px;
  margin: 0 auto;
  padding: 36px 20px 80px;
}
/* Tighten the gap when a page immediately follows a mode banner — the
   banner already provides strong vertical presence, so the back button
   and content below it shouldn't float with another full measure of
   whitespace on top of that. */
.mode-banner + .page { padding-top: 18px; }

.crumb {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--brass);
  margin-bottom: 8px;
}
.crumb--reading { color: var(--thread); }

/* Global Back control — same treatment everywhere it appears (every screen
   except the home landing page, where there's nowhere meaningful to go
   back to). Deliberately neutral/plum, not mode-colored, since it's shared
   navigation chrome rather than mode-specific content. */
.back-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-body);
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--plum);
  background: transparent;
  border: none;
  padding: 6px 4px;
  margin-bottom: 14px;
  cursor: pointer;
  border-radius: 6px;
}
.back-button span { font-size: 1.05em; line-height: 1; }
.back-button:hover { background: var(--plum-tint); }
.back-button:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

h1.page-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(1.8rem, 3vw, 2.6rem);
  margin: 0 0 6px;
  color: var(--plum-deep);
}

p.page-lede {
  font-size: 1.02rem;
  color: #52424E;
  max-width: 62ch;
  margin: 0 0 28px;
}

/* ---------------- Home screen ---------------- */

.hero {
  text-align: center;
  padding: 56px 20px 40px;
}
.hero .crumb { text-align: center; }
.hero h1 {
  font-family: var(--font-display);
  font-size: clamp(2.2rem, 5vw, 3.4rem);
  margin: 6px 0 12px;
  color: var(--plum-deep);
  font-weight: 600;
}
.hero p {
  max-width: 56ch;
  margin: 0 auto;
  color: #52424E;
  font-size: 1.05rem;
}

.mode-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
  max-width: 900px;
  margin: 36px auto 0;
  padding: 0 20px;
}
@media (max-width: 680px) {
  .mode-grid { grid-template-columns: 1fr; }
}

.mode-card {
  position: relative;
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 30px 26px 26px;
  cursor: pointer;
  text-align: left;
  overflow: hidden;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  font-family: var(--font-body);
}
.mode-card:hover, .mode-card:focus-visible {
  transform: translateY(-3px);
  box-shadow: var(--shadow);
}
.mode-card--music {
  border-top: 4px solid var(--brass);
  background: linear-gradient(180deg, rgba(168,128,47,0.09) 0%, var(--paper-raised) 90px);
}
.mode-card--reading {
  border-top: 4px solid var(--thread);
  background: linear-gradient(180deg, rgba(168,67,61,0.08) 0%, var(--paper-raised) 90px);
}

/* Generic decorative border variants for card pairs that AREN'T the actual
   Music/Reading mode distinction (e.g. the Easy/Hard difficulty picker) —
   kept visually similar but semantically separate so strengthening the
   real mode colors above never bleeds into unrelated UI. */
.mode-card--accent-brass { border-top: 4px solid var(--brass); }
.mode-card--accent-brass .mode-card__cta { color: var(--brass); }
.mode-card--accent-thread { border-top: 4px solid var(--thread); }
.mode-card--accent-thread .mode-card__cta { color: var(--thread); }

/* Reading Mode's Easy/Hard choice deliberately does NOT reuse Home's exact
   card language (top-colored-border, cream fill) — a left accent bar on a
   plain white card reads as "pick one of these options within Reading
   Mode" rather than "pick a whole different mode", keeping the Home vs.
   Mode vs. Activity distinction visually honest even though both use the
   same underlying .mode-card component. */
.reading-choice-grid .mode-card {
  border-top: none;
  border-left: 5px solid var(--line);
  background: #fff;
  padding-left: 22px;
}
.reading-choice-grid .mode-card--accent-thread { border-left-color: var(--thread); }
.reading-choice-grid .mode-card--accent-brass { border-left-color: var(--brass); }
.reading-choice-grid .mode-card--accent-leaf { border-left-color: var(--leaf); }
.reading-choice-grid .mode-card--accent-leaf .mode-card__cta { color: var(--leaf); }

/* Browse is a single choice, not a pair — collapse the two-column grid to
   one narrower column so a lone card doesn't stretch full-width and read
   as equal in "weight" to the Practice pair above it. Reuses the exact
   same card component (same radius/shadow/spacing system) so it still
   reads as part of the same page, just visually distinct via the section
   heading + its own leaf-green accent, not a whole new container style. */
.reading-choice-grid--single {
  grid-template-columns: minmax(0, 1fr);
  max-width: 460px;
  margin-left: 0;
  margin-right: 0;
}

/* Lightweight section labels ("Practice" / "Browse") — this is the whole
   fix for the "two sets of the same options" problem: one heading, one
   set of cards, explanation attached directly under each card's own
   title rather than repeated in a separate block above them. */
.reading-section-heading {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--thread);
  margin: 30px 0 14px;
}
.reading-section-heading:first-of-type { margin-top: 22px; }

.mode-card__title {
  font-family: var(--font-display);
  font-size: 1.65rem;
  font-weight: 600;
  margin: 6px 0 8px;
  color: var(--plum-deep);
}
.mode-card__tagline {
  font-weight: 700;
  font-size: 1.02rem;
  color: var(--ink);
  margin: 0 0 8px;
}
.mode-card__desc {
  color: #574A55;
  font-size: 0.96rem;
  line-height: 1.5;
  margin: 0 0 18px;
}
.mode-card__cta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--plum);
}
.mode-card--music .mode-card__cta { color: var(--brass); }
.mode-card--reading .mode-card__cta { color: var(--thread); }

.mode-card__icon {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px;
}
.mode-card__icon svg { width: 22px; height: 22px; }
.mode-card--music .mode-card__icon { background: var(--brass-light); color: var(--plum-deep); }
.mode-card--reading .mode-card__icon { background: var(--thread-tint); color: var(--thread); }

/* ---------------- Mode banner (Music Mode / Reading Mode "you are here"
   header) ----------------
   This is the strongest single signal that the user has left the Home
   dashboard and entered a dedicated environment — a full-width colored
   band, not just recolored text. Deliberately used ONLY on each mode's own
   landing screen (Listen & Identify / Study picker), not on every deeper
   activity screen — activities get a lighter accent instead (see
   .activity-accent below), so the hierarchy Home -> Mode -> Activity reads
   as three genuinely different levels rather than the same banner
   repeated everywhere. */
.mode-banner {
  /* Sits as a full-width sibling of .page (not nested inside its padding),
     so no negative margin is needed to bleed to the edges — it's already
     edge-to-edge. (A negative side margin here was the mobile overflow
     bug: with no ancestor padding to cancel, it pushed the banner past
     the viewport instead of flush with it.) */
  padding: 34px 20px 26px;
  text-align: center;
}
.mode-banner__icon {
  width: 52px; height: 52px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 14px;
}
.mode-banner__icon svg { width: 26px; height: 26px; }
.mode-banner__eyebrow {
  font-family: var(--font-mono); font-size: 0.78rem; text-transform: uppercase;
  letter-spacing: 0.12em; margin-bottom: 8px;
}
.mode-banner__title {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(1.9rem, 4vw, 2.6rem);
  margin: 0 0 10px;
}
.mode-banner__subtitle {
  font-size: 1rem; max-width: 52ch; margin: 0 auto;
}

.mode-banner--music {
  background: linear-gradient(180deg, var(--plum) 0%, var(--plum-deep) 100%);
}
.mode-banner--music .mode-banner__icon { background: var(--brass-light); color: var(--plum-deep); }
.mode-banner--music .mode-banner__eyebrow { color: var(--brass-light); }
.mode-banner--music .mode-banner__title { color: var(--paper); }
.mode-banner--music .mode-banner__subtitle { color: rgba(251,247,239,0.82); }

.mode-banner--reading {
  background: var(--reading-wash, #F3E4D3);
  border-bottom: 3px solid var(--thread);
}
.mode-banner--reading .mode-banner__icon { background: var(--thread); color: var(--paper); }
.mode-banner--reading .mode-banner__eyebrow { color: var(--thread); }
.mode-banner--reading .mode-banner__title { color: var(--plum-deep); }
.mode-banner--reading .mode-banner__subtitle { color: #6b5142; }

@media (max-width: 640px) {
  .mode-banner { padding: 26px 14px 20px; }
}

/* Lighter, activity-level mode accent — a slim colored rule at the top of
   the content area plus a matching crumb color (crumb color already
   handled elsewhere), so deep activity screens still quietly say "you're
   in Music/Reading Mode" without repeating the big banner treatment. This
   is what makes Activity feel like a distinct third level rather than a
   copy of the Mode page. Applied directly on .page itself (see page()),
   so it must NOT touch margin — .page already centers itself with
   margin:0 auto and this can't fight that. */
.activity-accent { border-top: 3px solid transparent; }
.activity-accent--music { border-top-color: var(--brass); }
.activity-accent--reading { border-top-color: var(--thread); }

/* ---------------- Buttons ---------------- */

.btn {
  font-family: var(--font-body);
  font-size: 0.92rem;
  font-weight: 600;
  border-radius: 8px;
  border: 1px solid var(--plum);
  background: var(--plum);
  color: var(--paper);
  padding: 10px 18px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn:hover { background: var(--plum-deep); }
.btn--ghost {
  background: transparent;
  color: var(--plum);
}
.btn--ghost:hover { background: var(--plum-tint); }
.btn--brass { background: var(--brass); border-color: var(--brass); color: var(--ink); }
.btn--brass:hover { background: #8f6c25; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

/* ---------------- Cards / lists ---------------- */

.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 14px;
}

.section-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
  margin: 22px 0 34px;
}
.tile {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  cursor: pointer;
  text-align: left;
  font-family: var(--font-body);
}
.tile:hover { border-color: var(--brass); }
.tile__num { font-family: var(--font-mono); font-size: 0.72rem; color: var(--brass); }
.tile__irish { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; color: var(--plum-deep); margin: 4px 0 2px; }
.tile__english { font-size: 0.85rem; color: #6b5c67; }

/* ---------------- Dance detail ---------------- */

.dance-header {
  border-bottom: 2px solid var(--brass-light);
  padding-bottom: 16px;
  margin-bottom: 22px;
}
.dance-header__irish { font-family: var(--font-display); font-size: 2rem; font-weight: 600; color: var(--plum-deep); margin: 0; }
.dance-header__english { font-size: 1.15rem; color: var(--thread); margin: 2px 0 10px; font-style: italic; }
.meta-tags { display: flex; gap: 8px; flex-wrap: wrap; }
.meta-tag {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  background: var(--plum-tint);
  color: var(--plum);
  border-radius: 999px;
  padding: 4px 10px;
}

.section-block { margin-bottom: 26px; }
.section-block__title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.2rem;
  color: var(--thread);
  margin: 0 0 10px;
}
/* Defensive backstop: if a table's content is ever wider than its column
   (e.g. an unusually long translation), scroll WITHIN the table only —
   never let it force the whole page wider (that's the "awkward horizontal
   scrolling" a mobile layout must avoid). */
/* overflow-x:auto alone implicitly computes overflow-y to auto too (per the
   CSS spec's "if one axis is scroll/auto/hidden, the other computes to
   auto" rule), which turns this into an unintended VERTICAL scroll
   container as well — that in turn changes the containing block for the
   table header's `position: sticky`, causing it to mis-paint. Explicit
   overflow-y: visible keeps this a horizontal-only scroll backstop, as
   originally intended. */
.table-scroll { overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch; }

table.movements {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.94rem;
}
table.movements th {
  text-align: left;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #8a7a86;
  border-bottom: 1px solid var(--line);
  padding: 6px 10px 8px 0;
}
table.movements td {
  padding: 10px 10px 10px 0;
  border-bottom: 1px solid #F0E9DA;
  vertical-align: top;
}
table.movements td.mov-order { font-family: var(--font-mono); color: var(--brass); width: 28px; }
table.movements td.mov-irish { font-style: italic; color: var(--plum-deep); }
table.movements td.mov-bars { font-family: var(--font-mono); }
.bars-unstated { color: #a8433d; font-family: var(--font-mono); font-size: 0.82rem; }

.notes-box {
  background: var(--leaf-tint);
  border-left: 3px solid var(--leaf);
  padding: 12px 16px;
  font-size: 0.9rem;
  border-radius: 0 6px 6px 0;
  margin-top: 6px;
}

/* ---------------- Beat-dots signature motif ---------------- */

.beat-dots { display: inline-flex; align-items: center; gap: 4px; vertical-align: middle; flex-wrap: wrap; max-width: 140px; }
.beat-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--line);
  display: inline-block;
}
.beat-dot--filled { background: var(--brass); }
.beat-gap { width: 6px; display: inline-block; }

/* ---------------- Quiz ---------------- */

.quiz-progress { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.quiz-score { font-family: var(--font-mono); font-size: 0.85rem; color: var(--plum); }

.quiz-question {
  font-family: var(--font-display);
  font-size: 1.35rem;
  color: var(--plum-deep);
  margin: 0 0 20px;
  line-height: 1.4;
}

.quiz-options { display: grid; gap: 10px; }
.quiz-option {
  text-align: left;
  padding: 14px 16px;
  border-radius: 8px;
  border: 1.5px solid var(--line);
  background: #fff;
  font-size: 0.98rem;
  cursor: pointer;
  font-family: var(--font-body);
}
.quiz-option:hover { border-color: var(--brass); }
.quiz-option--correct { border-color: var(--leaf); background: var(--leaf-tint); }
.quiz-option--wrong { border-color: var(--thread); background: var(--thread-tint); }
.quiz-option:disabled { cursor: default; }

.quiz-feedback { margin-top: 18px; font-size: 0.95rem; }
.quiz-feedback strong.correct-text { color: var(--leaf); }
.quiz-feedback strong.wrong-text { color: var(--thread); }

.quiz-summary { text-align: center; padding: 40px 20px; }
.quiz-summary__score {
  font-family: var(--font-display);
  font-size: 3rem;
  color: var(--plum-deep);
  margin: 6px 0;
}

/* ---------------- Flashcards ---------------- */

.flash-wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.flashcard {
  width: 100%;
  max-width: 520px;
  min-height: 220px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
  cursor: pointer;
  box-shadow: var(--shadow);
  position: relative;
}
.flashcard__label {
  position: absolute; top: 14px; left: 18px;
  font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--brass);
}
.flashcard__text {
  font-family: var(--font-display);
  font-size: 1.5rem;
  color: var(--plum-deep);
  white-space: pre-line;
  line-height: 1.5;
}
.flashcard--back .flashcard__text { font-family: var(--font-body); font-size: 1.1rem; color: var(--ink); }
.flash-hint { font-family: var(--font-mono); font-size: 0.75rem; color: #9a8b96; }

/* ---------------- Music table (Browse Tunes) ---------------- */

table.tunes { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
table.tunes th {
  text-align: left; font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase;
  letter-spacing: 0.05em; color: #8a7a86; border-bottom: 1px solid var(--line); padding: 8px 10px 8px 0;
  background: var(--paper);
}
/* NOTE: this header is intentionally NOT position:sticky. It was previously,
   but sticky positioning inside the .table-scroll wrapper (needed for
   horizontal-scroll safety on long rows) produced an inconsistent paint —
   the header could render out of order relative to the first couple of
   body rows. The layout itself measured as correct (verified via
   getBoundingClientRect), so this looks like an engine-level compositing
   quirk with sticky-inside-auto-overflow rather than a real layout bug —
   but a table header staying visible while scrolling is a minor
   convenience, not worth shipping an unreliable render for. Removed
   rather than risk it. */
table.tunes td { padding: 10px 10px 10px 0; border-bottom: 1px solid #F0E9DA; vertical-align: middle; }
table.tunes td.name { font-family: var(--font-display); font-weight: 600; color: var(--plum-deep); }

.status-pill {
  font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.03em;
  padding: 3px 9px; border-radius: 999px; display: inline-block;
}
.status-pill--exact { background: var(--leaf-tint); color: var(--leaf); }
.status-pill--fuzzy { background: #FBF0D6; color: #8f6c25; }
.status-pill--unmatched { background: var(--thread-tint); color: var(--thread); }

.play-btn {
  border: 1px solid var(--brass); background: var(--brass-light); color: var(--ink);
  border-radius: 999px; padding: 4px 12px; font-size: 0.78rem; cursor: pointer; font-family: var(--font-mono);
}
.play-btn:hover { background: var(--brass); }

.embed-wrap { margin: 14px 0; }
.embed-wrap iframe { border-radius: 10px; }

.mini-btn {
  font-family: var(--font-mono); font-size: 0.72rem; padding: 5px 10px; border-radius: 6px;
  border: 1px solid var(--plum); background: transparent; color: var(--plum); cursor: pointer;
}
.mini-btn:hover { background: var(--plum-tint); }

.filter-bar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.filter-chip {
  font-family: var(--font-mono); font-size: 0.75rem; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: #fff; cursor: pointer; color: #574A55;
}
.filter-chip[aria-pressed="true"] { background: var(--plum); color: var(--paper); border-color: var(--plum); }

/* Secondary section nav (Study/Browse, Listen/Browse/Quiz/Review): a light
   tab strip, not a row of full buttons — this is wayfinding, not the task
   itself, so it should read as clearly secondary to whatever screen/card
   follows it rather than competing for the same visual weight. */
.tab-strip-group { margin: 18px 0 26px; }
/* Underline-style tab bar — reads unambiguously as "navigation within this
   mode" rather than a row of standalone buttons or another set of menu
   bubbles. A shared baseline rule ties all four/two tabs together as one
   control; the active tab is the one whose accent-colored underline
   breaks that shared line. */
.tab-strip {
  display: flex; gap: 4px; flex-wrap: wrap;
  margin: 18px 0 0;
  border-bottom: 1px solid var(--line);
}
.tab-strip-group .tab-strip { margin: 0; }
.tab-strip button {
  font-family: var(--font-body); font-size: 0.88rem; font-weight: 600;
  padding: 9px 14px 10px; cursor: pointer;
  border: none; border-bottom: 3px solid transparent;
  margin-bottom: -1px; /* sit flush on the shared baseline rule */
  background: transparent; color: #7a6c76;
  border-radius: 0;
  transition: color 150ms ease, border-bottom-color 150ms ease, background-color 150ms ease;
}
.tab-strip button[aria-current="true"] {
  color: var(--plum); border-bottom-color: var(--plum); font-weight: 700;
}
.tab-strip button:hover:not([aria-current="true"]) { color: var(--ink); background: rgba(0,0,0,0.03); }

/* Music Mode's persistent shell: topbar/banner/tabs are built once and
   left alone while switching between Listen & Identify / Browse Tunes /
   Metadata Quiz — only this content area is swapped, with a short fade,
   so the three activities feel like tabs in one workspace rather than
   separate pages. See renderMusicShell(). ~260ms total (130ms out + CSS
   150ms in) — quick and responsive, not a showcase animation. */
#music-activity-content {
  transition: opacity 150ms ease, transform 150ms ease;
  opacity: 1;
  transform: translateY(0);
}
#music-activity-content.music-activity-content--out {
  opacity: 0;
  transform: translateY(6px);
}
/* Each activity's own intro line sits directly under the centered banner
   above it — it needs to keep sharing that same visual axis, not fall
   back to .page-lede's normal left-aligned default (which is correct
   elsewhere, e.g. Reading Mode's data-heavy activity screens, but wrong
   here since Music Mode's banner/tabs are always centered). text-align
   alone isn't enough since .page-lede has a max-width without margin:auto
   — same fix pattern as the original header-alignment work, just scoped
   to wherever it's the first thing in an activity's content instead of
   requiring every content-builder to wrap it individually. */
#music-activity-content .page-lede:first-child {
  text-align: center;
  margin-left: auto;
  margin-right: auto;
}
@media (prefers-reduced-motion: reduce) {
  .tab-strip button { transition: none; }
  #music-activity-content { transition: none; }
}

/* Mode-specific active-tab color, consistent with the Music/Reading home
   card colors — so the same color coding carries through every screen
   inside each mode, not just the home page. */
.tab-strip--music button[aria-current="true"] {
  color: #8f6c25; border-bottom-color: var(--brass);
}
.tab-strip--reading button[aria-current="true"] {
  color: var(--thread); border-bottom-color: var(--thread);
}

.tab-strip__hint {
  font-size: 0.86rem; color: #6b5c67; margin: 10px 0 0; max-width: 62ch;
}

/* Scoped header-centering for screens where a header (title/subtitle) sits
   directly above a horizontally-centered group of "menu bubble" cards
   (currently: Music Mode's Listen & Identify, and Reading Mode's own
   lede here). text-align:center alone is not enough: .page-lede has a
   max-width without its own margin:auto, so without the explicit
   centering below it would stay flush against the left edge and only its
   text would center *within* that off-center box. Scoped to this class
   rather than changing the base .page-lede/.tab-strip rules, since those
   are deliberately left-aligned elsewhere (dance detail, quiz screens,
   etc.) where centering would hurt readability of longer/tabular content. */
.centered-page-header { text-align: center; }
.centered-page-header .page-lede { margin-left: auto; margin-right: auto; }
.centered-page-header .tab-strip { justify-content: center; }

.empty-state {
  text-align: center; padding: 60px 20px; color: #8a7a86; font-family: var(--font-body);
}

/* ---------------- Reading Mode: Study (Easy/Hard) ---------------- */

.field-label {
  font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--brass); display: block; margin-bottom: 8px;
}

/* Dance name is the anchor fact of the whole screen — per design spec it
   needs to read as clearly the most important thing on the page, not just
   another card heading. */
.study-dance-card { border-left: 4px solid var(--brass); padding-top: 18px; padding-bottom: 20px; }
.study-dance-name {
  font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.15;
  color: var(--plum-deep);
}
.study-dance-sub { font-size: 0.92rem; color: #6b5c67; margin-top: 4px; font-style: italic; }
@media (max-width: 480px) {
  .study-dance-name { font-size: 1.5rem; }
}

.text-input {
  width: 100%;
  font-family: var(--font-body); font-size: 1rem;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
}
.text-input:focus { border-color: var(--brass); outline: none; }

.orderer-list { display: flex; flex-direction: column; gap: 8px; }
.orderer-row {
  display: flex; align-items: center; gap: 12px;
  background: #fff; border: 1.5px solid var(--line); border-radius: 8px;
  padding: 10px 14px;
  transition: background-color 0.35s ease, border-color 0.35s ease;
}
.orderer-row--moved {
  background: var(--plum-tint);
  border-color: var(--plum);
}
@media (prefers-reduced-motion: reduce) {
  .orderer-row { transition: none; }
}
.orderer-row__num {
  font-family: var(--font-mono); font-size: 0.85rem; color: var(--brass);
  width: 20px; flex-shrink: 0; text-align: center;
}
.orderer-row__content { flex: 1; min-width: 0; }
.orderer-row__irish { font-style: italic; color: var(--plum-deep); font-size: 0.98rem; }
.orderer-row__english { font-size: 0.9rem; color: #574A55; }
.orderer-row__bars { font-family: var(--font-mono); font-size: 0.78rem; color: var(--brass); margin-top: 2px; }
.orderer-row__controls { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.orderer-btn {
  width: 36px; height: 32px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--paper-raised);
  cursor: pointer; font-size: 1rem; color: var(--plum);
  display: flex; align-items: center; justify-content: center;
}
.orderer-btn:hover:not(:disabled) { background: var(--brass-light); }
.orderer-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.result-line {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0; border-bottom: 1px solid #F0E9DA;
}
.result-line:last-child { border-bottom: none; }

.order-compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 640px) { .order-compare-grid { grid-template-columns: 1fr; } }

.order-compare-list { padding-left: 20px; margin: 0; }
.order-compare-list__item { margin-bottom: 7px; font-size: 0.95rem; }
.order-compare-list__item--mismatch { color: var(--thread); font-weight: 600; }
.order-compare-list__mark { font-family: var(--font-mono); font-size: 0.85em; }
.order-compare-list__item--mismatch .order-compare-list__mark { color: var(--thread); }
.order-compare-list__item:not(.order-compare-list__item--mismatch) .order-compare-list__mark { color: var(--leaf); }

/* ---------------- Music Mode: Listen & Identify flashcards ---------------- */

.session-progress {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin-bottom: 18px; font-family: var(--font-mono); font-size: 0.78rem; color: #8a7a86;
}
.session-progress__dots { display: flex; gap: 4px; flex-wrap: wrap; max-width: 320px; }
.session-progress__dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.session-progress__dot--done { background: var(--brass); }
.session-progress__dot--current { background: var(--thread); transform: scale(1.4); }

.audio-card {
  max-width: 560px;
  margin: 0 auto;
  min-height: 380px;
  border-radius: 20px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(36,22,38,0.1), 0 16px 40px rgba(36,22,38,0.16);
  perspective: 1000px;
  position: relative;
}

/* Distinct, high-contrast colors for the two states, per spec:
   FRONT ("still listening/guessing") = deep plum, associated with the
   app's "in progress / mystery" mood, light text on dark.
   BACK ("answer revealed") = warm cream, the app's established
   "information" surface, dark text on light. Both pairs exceed WCAG AA
   contrast (paper on plum ≈ 12:1; ink on paper-raised ≈ 13:1). */
.audio-face {
  min-height: 380px;
  border-radius: 20px;
  padding: 40px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 18px;
}
.audio-face--front {
  background: linear-gradient(165deg, var(--plum) 0%, var(--plum-deep) 100%);
  color: var(--paper);
  border: 2px solid var(--plum-deep);
}
.audio-face--back {
  background: var(--paper-raised);
  color: var(--ink);
  border: 2px solid var(--brass-light);
}
.audio-face__eyebrow {
  font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
  opacity: 0.75;
}
.audio-face--front .audio-face__eyebrow { color: var(--brass-light); }
.audio-face--back .audio-face__eyebrow { color: var(--thread); }

/* .btn--ghost's default (plum text, transparent bg) is unreadable on the
   dark front face — needs its own light-on-dark treatment here. */
.audio-face--front .btn--ghost {
  color: var(--paper);
  border-color: rgba(251, 247, 239, 0.45);
}
.audio-face--front .btn--ghost:hover { background: rgba(251, 247, 239, 0.12); }

.audio-playbtn {
  width: 128px; height: 128px; border-radius: 50%;
  border: none;
  background: var(--brass-light);
  color: var(--plum-deep);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 6px 22px rgba(0,0,0,0.32);
  position: relative;
  flex-shrink: 0;
  transition: transform 0.15s ease, background-color 0.15s ease;
}
.audio-playbtn:hover { background: var(--brass); transform: scale(1.04); }
@media (prefers-reduced-motion: reduce) { .audio-playbtn:hover { transform: none; } }
.audio-playbtn svg { width: 48px; height: 48px; }
.audio-playbtn--playing::before {
  content: "";
  position: absolute; inset: -10px;
  border-radius: 50%;
  border: 2px solid var(--brass-light);
  animation: audio-pulse 1.6s ease-out infinite;
}
@keyframes audio-pulse {
  0% { transform: scale(0.9); opacity: 0.9; }
  100% { transform: scale(1.35); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .audio-playbtn--playing::before { animation: none; opacity: 0.4; }
}

.audio-face__status {
  font-family: var(--font-body); font-size: 0.92rem; min-height: 1.3em;
}
.audio-face--front .audio-face__status { color: rgba(251,247,239,0.85); }
.audio-face__status--error { color: var(--thread-tint); font-weight: 600; }

/* Error state (Spotify never responded in time — never leaves the button
   permanently disabled/appearing dead; always clickable to retry). Same
   circular button, distinguished by color + icon + status text together —
   not color alone. */
.audio-playbtn--error { background: var(--thread-tint); color: var(--thread); }
.audio-playbtn--error:hover { background: #F5D9D6; }

.audio-face__name {
  font-family: var(--font-display); font-weight: 600; font-size: 1.7rem;
  color: var(--plum-deep);
}

.audio-meta-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  width: 100%; max-width: 320px;
}
.audio-meta-cell {
  background: #fff; border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px;
}
.audio-meta-cell__label {
  font-family: var(--font-mono); font-size: 0.65rem; text-transform: uppercase;
  letter-spacing: 0.05em; color: #8a7a86; display: block; margin-bottom: 3px;
}
.audio-meta-cell__value { font-family: var(--font-body); font-weight: 600; font-size: 1rem; color: var(--plum-deep); }

.btn--big { padding: 14px 28px; font-size: 1rem; }

.audio-fallback-note {
  font-family: var(--font-mono); font-size: 0.7rem; color: var(--brass); text-align: center; margin-top: 6px;
}

/* Title-free playback control used inside the Metadata Quiz's
   listen-and-identify questions — same visual language as the Listen &
   Identify flashcard's front, just compact enough to sit above the answer
   options rather than filling a whole card. */
.quiz-audio-player {
  display: flex; align-items: center; gap: 16px;
  background: var(--plum); border-radius: 14px;
  padding: 18px 22px; margin: 4px 0 20px;
}
.quiz-playbtn { width: 56px; height: 56px; flex-shrink: 0; }
.quiz-playbtn svg { width: 24px; height: 24px; }
.quiz-audio-player__status {
  font-family: var(--font-body); font-size: 0.92rem; color: rgba(251,247,239,0.9);
}
.quiz-audio-fallback-note {
  font-family: var(--font-mono); font-size: 0.75rem; color: var(--brass);
  margin: 4px 0 8px; line-height: 1.5;
}

/* ---------------- Footer ---------------- */

.app-footer {
  text-align: center;
  padding: 30px 20px 50px;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: #9a8b96;
}

// Flattens a dance's sections into one ordered list for quiz/flashcard use,
// tagging each movement with its section title.
function flattenDanceMovements(dance) {
  const out = [];
  dance.sections.forEach(section => {
    section.movements.forEach(m => {
      out.push({ ...m, section: section.title });
    });
  });
  return out;
}

<script>
/* ============================================================
   LOGIC LAYER
   ============================================================ */
/**
 * MUSIC MATCHING UTILITY
 * Used to (re-)match a Spotify track title against a reference-document song
 * name — this is how the original dataset in MUSIC_DATA above was built and
 * verified. Not called by the running app (there's no in-app UI for
 * re-matching), kept here as the documented, reusable logic for any future
 * data-maintenance pass against a refreshed Spotify playlist fetch.
 */
const Matching = (function () {

  // Strip anything in parentheses/brackets, per spec.
  function stripParens(str) {
    return str.replace(/[\(\[][^\)\]]*[\)\]]/g, " ");
  }

  // Normalize for comparison: strip parens, lowercase, strip minor
  // punctuation, collapse whitespace, drop a small set of leading articles
  // so "The X" and "X" compare equal.
  function normalize(str) {
    return stripParens(str)
      .toLowerCase()
      .replace(/['’]/g, "")           // apostrophes
      .replace(/[.,!?:;"“”]/g, "")    // minor punctuation
      .replace(/^\s*the\s+/i, "")     // leading "the"
      .replace(/\s+/g, " ")
      .trim();
  }

  // Levenshtein distance, for fuzzy fallback when normalized strings aren't
  // identical (handles spelling variants like "Shillelah" vs "Shilelagh").
  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    const d = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) d[i][0] = i;
    for (let j = 0; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      }
    }
    return d[m][n];
  }

  /**
   * Compare a reference-document name against a Spotify track title.
   * Returns { status, similarity } where status is one of:
   *   "matched-exact"  - identical after normalization
   *   "matched-fuzzy"  - within edit-distance threshold (likely spelling
   *                      variant / minor wording difference) — ALWAYS meant
   *                      to be surfaced to the user for confirmation, never
   *                      silently treated as certain.
   *   "no-match"       - too different to assume they're the same song.
   */
  function compare(referenceName, spotifyTitle) {
    const a = normalize(referenceName);
    const b = normalize(spotifyTitle);
    if (a === b) return { status: "matched-exact", similarity: 1 };

    const dist = levenshtein(a, b);
    const longer = Math.max(a.length, b.length) || 1;
    const similarity = 1 - dist / longer;

    // Fuzzy band: close enough to flag as a probable match, but always
    // surfaced for human confirmation rather than auto-accepted silently.
    if (similarity >= 0.72) return { status: "matched-fuzzy", similarity };
    return { status: "no-match", similarity };
  }

  /**
   * Given one reference tune name and a list of candidate Spotify tracks
   * ({trackId, title, artist}), return the best candidate (or null) plus its
   * comparison result. Not called by the running app — part of the same
   * documented matching utility above, for any future re-matching pass.
   */
  function bestMatch(referenceName, candidates) {
    let best = null, bestResult = { status: "no-match", similarity: -1 };
    candidates.forEach(c => {
      const result = compare(referenceName, c.title);
      if (result.similarity > bestResult.similarity) {
        best = c;
        bestResult = result;
      }
    });
    if (!best || bestResult.status === "no-match") return null;
    return { candidate: best, result: bestResult };
  }

  return { normalize, compare, bestMatch };
})();


/**
 * QUIZ ENGINE
 * All questions are generated FROM the data files at runtime. Nothing here
 * names a specific dance or song — add a dance to readingData.js or a tune
 * to musicData.js and it is automatically eligible for every question type
 * below, with no code changes required.
 */
const Quiz = (function () {

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function sample(arr, n) { return shuffle(arr).slice(0, n); }

  function makeMC(id, type, prompt, correctText, distractorPool, meta) {
    const distractors = sample(distractorPool.filter(d => d !== correctText), Math.min(3, distractorPool.length));
    const options = shuffle([correctText, ...distractors]);
    return {
      id, type, prompt,
      options,
      correctIndex: options.indexOf(correctText),
      meta: meta || {},
    };
  }

  // ---------------- MUSIC MODE ----------------

  function musicQuestionPool(musicData) {
    const pool = [];
    const allNames = musicData.map(t => t.name);
    const allTuneTypes = [...new Set(musicData.map(t => t.tuneType))];
    const allTimeSigs = [...new Set(musicData.map(t => t.timeSignature))];

    musicData.forEach(tune => {
      pool.push(() => makeMC(
        `tune-type-${tune.id}`, "tune-type",
        `What type of tune is "${tune.name}"?`,
        tune.tuneType, allTuneTypes, { tuneId: tune.id }
      ));

      pool.push(() => makeMC(
        `tune-sig-${tune.id}`, "time-signature",
        `What time signature is "${tune.name}" in?`,
        tune.timeSignature, allTimeSigs, { tuneId: tune.id }
      ));

      const stepPool = [...new Set(musicData.map(t => String(t.stepBars)))];
      pool.push(() => makeMC(
        `tune-step-${tune.id}`, "step-bars",
        `How many bars are in the STEP of "${tune.name}"?`,
        String(tune.stepBars), stepPool, { tuneId: tune.id }
      ));

      const setPool = [...new Set(musicData.map(t => String(t.setBars)))];
      pool.push(() => makeMC(
        `tune-set-${tune.id}`, "set-bars",
        `How many bars are in the SET of "${tune.name}"?`,
        String(tune.setBars), setPool, { tuneId: tune.id }
      ));

      // Audio-ID question, only possible when a Spotify track is matched
      if (tune.spotify && (tune.matchStatus === "matched-exact" || tune.matchStatus === "matched-fuzzy")) {
        pool.push(() => makeMC(
          `tune-audio-${tune.id}`, "audio-id",
          `Listen — which set dance tune is this?`,
          tune.name, allNames, { tuneId: tune.id, trackId: tune.spotify.trackId }
        ));
      }
    });

    return pool;
  }

  function generateMusicQuiz(musicData, count, onlyAudio) {
    // Materialize once, then filter — filtering generator *functions* before
    // calling them isn't possible (their type isn't known until they run),
    // so build all candidate questions first and pick from the right subset.
    const pool = musicQuestionPool(musicData).map(fn => fn());
    const candidates = onlyAudio ? pool.filter(q => q.type === "audio-id") : pool;
    return sample(candidates, Math.min(count, candidates.length));
  }

  return {
    generateMusicQuiz,
    shuffle,
  };
})();



/**
 * STORE — thin localStorage wrapper.
 * Everything here is namespaced under "irishDanceApp:" and JSON-encoded.
 * If localStorage is unavailable (e.g. private browsing in some browsers),
 * calls fail quietly and the app just runs without persistence.
 */
const Store = (function () {
  const PREFIX = "irishDanceApp:";

  function get(key, fallback) {
    try {
      const raw = localStorage.getItem(PREFIX + key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }

  function set(key, value) {
    try {
      localStorage.setItem(PREFIX + key, JSON.stringify(value));
      return true;
    } catch (e) {
      return false;
    }
  }

  // --- Quiz stats: { [quizKey]: { attempts, correct, lastScore } } ---
  function getStats() { return get("quizStats", {}); }
  function recordQuizResult(quizKey, correctCount, totalCount) {
    const stats = getStats();
    const s = stats[quizKey] || { attempts: 0, correct: 0, total: 0, bestScore: 0 };
    s.attempts += 1;
    s.correct += correctCount;
    s.total += totalCount;
    s.bestScore = Math.max(s.bestScore, Math.round((correctCount / totalCount) * 100));
    s.lastScore = Math.round((correctCount / totalCount) * 100);
    stats[quizKey] = s;
    set("quizStats", stats);
    return s;
  }

  return {
    get, set,
    getStats, recordQuizResult,
  };
})();


/**
 * RENDER HELPERS
 * Minimal DOM-builder so app.js doesn't need innerHTML string-splicing
 * (keeps user-supplied-looking text safe and the code easier to follow).
 */
function h(tag, attrs, children) {
  const node = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(key => {
    if (key === "class") node.className = attrs[key];
    else if (key === "html") node.innerHTML = attrs[key];
    else if (key.startsWith("on") && typeof attrs[key] === "function") {
      node.addEventListener(key.slice(2).toLowerCase(), attrs[key]);
    } else if (key === "disabled" || key === "checked" || key === "readOnly") {
      // Boolean IDL properties: HTML treats the mere *presence* of the
      // attribute as true, even if its value is the string "false" — so
      // these must be set as JS properties, not via setAttribute.
      node[key] = !!attrs[key];
    } else if (attrs[key] !== null && attrs[key] !== undefined) {
      node.setAttribute(key, attrs[key]);
    }
  });
  (children || []).forEach(child => {
    if (child === null || child === undefined) return;
    if (typeof child === "string" || typeof child === "number") {
      node.appendChild(document.createTextNode(String(child)));
    } else {
      node.appendChild(child);
    }
  });
  return node;
}

function mount(node) {
  const root = document.getElementById("app");
  root.innerHTML = "";
  root.appendChild(node);
  window.scrollTo(0, 0);
}

// Small "beat dots" motif: renders a row of dots grouped in threes, echoing
// the source book's "sidestep counted in threes" language. Used as a
// lightweight visual signature across the app (progress bars, bar counts).
function beatDots(total, filled) {
  const wrap = h("span", { class: "beat-dots", "aria-hidden": "true" }, []);
  for (let i = 0; i < total; i++) {
    if (i > 0 && i % 3 === 0) wrap.appendChild(h("span", { class: "beat-gap" }, []));
    wrap.appendChild(h("span", { class: "beat-dot" + (i < filled ? " beat-dot--filled" : "") }, []));
  }
  return wrap;
}
